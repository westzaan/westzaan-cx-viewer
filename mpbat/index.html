<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MPB Asset Tracker</title>
<link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css">
<style>
/* layout: app shell. Left = 3D viewer over the floor plan. Right = one iOS-style column (Rooms, Doors, Equipment, Check). Sheets slide over the column. */
:root{--bg:#f2f2f7;--card:#ffffff;--fill:#e9e9ee;--fg:#111114;--sub:#6c6c72;--sep:#d8d8dd;--tint:#007aff;--tint-soft:#e3efff;--ok:#248a3d;--warn:#b25000;--crit:#d70015;--wall:#2b2b30;
 --r:12px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000000;--card:#1c1c1e;--fill:#2c2c2e;--fg:#f5f5f7;--sub:#98989f;--sep:#38383a;--tint:#0a84ff;--tint-soft:#10305a;--ok:#30d158;--warn:#ff9f0a;--crit:#ff453a;--wall:#e5e5ea;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
#gate{max-width:420px;margin:16vh auto;padding:28px 24px;text-align:center;background:var(--card);border-radius:20px}
#gate h2{margin:0 0 6px;font-size:22px}
#gate p{color:var(--sub);margin:0 0 14px}
.primary{background:var(--tint);color:#fff;border-radius:12px;padding:11px 20px;font-weight:600}
#app{display:grid;grid-template-columns:minmax(0,1fr) 440px;height:100%;gap:0}
#left{display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px 6px 12px 12px;gap:10px}
#side{position:relative;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--sep);background:var(--bg)}
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
#vcard{flex:1 1 55%;min-height:260px;display:flex;flex-direction:column;position:relative}
#fv{position:relative;flex:1;min-height:0;background:var(--fill)}
.vbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px}
.vbar .msg{flex:1 1 140px;min-width:0;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillbtn{background:var(--fill);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.pillbtn[aria-pressed="true"],.pillbtn.on{background:var(--tint);color:#fff}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:0}
.seg button{padding:4px 11px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgb(0 0 0 / .18)}
#dbar{position:absolute;left:10px;top:56px;z-index:5;display:flex;flex-direction:column;gap:6px}
#dbar button{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(12px);display:grid;place-items:center;color:var(--sub);box-shadow:0 1px 4px rgb(0 0 0 / .18)}
#dbar button[aria-pressed="true"]{background:var(--tint);color:#fff}
#dbar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#dbar i{height:4px}
#legend3d{position:absolute;left:10px;bottom:10px;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border-radius:10px;padding:7px 10px;font-size:12px;max-width:60%;max-height:45%;overflow:auto}
#legend3d div{display:flex;gap:7px;align-items:center;padding:1px 0}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
#pcard{flex:0 0 auto;display:flex;flex-direction:column}
#pcard.closed #plan,#pcard.closed #fnleg{display:none}
#plan{padding:0 8px;max-height:32vh;overflow:auto}
#plan svg{display:block;width:100%;height:auto}
#plan .rm{stroke:none;cursor:pointer;fill-opacity:.5}
#plan .rm:hover{fill-opacity:.75}
#plan .rm.dim{fill-opacity:.1}
#plan .rm.sel{fill-opacity:.95;stroke:var(--tint);stroke-width:.3}
#plan .w{fill:none;stroke:var(--wall);stroke-width:.07;stroke-linecap:round;pointer-events:none;opacity:.85}
#plan text{font:600 .95px var(--font);fill:var(--fg);pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:.25}
#plan .dot{fill:var(--tint);stroke:#fff;stroke-width:.08;pointer-events:none}
#fnleg{display:flex;flex-wrap:wrap;gap:4px 6px;padding:6px 10px 10px}
#fnleg button{display:flex;gap:5px;align-items:center;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--fill)}
#fnleg button.on{outline:2px solid var(--tint)}
#head{padding:14px 16px 8px}
#head h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em}
#head p{margin:2px 0 10px;color:var(--sub);font-size:12px}
#tabs{display:flex;width:100%}
#tabs button{flex:1}
#body{flex:1;min-height:0;overflow:auto;padding:4px 16px 30px}
.search{width:100%;background:var(--fill);border:0;border-radius:10px;padding:8px 12px;margin:6px 0 8px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tools select{background:var(--fill);border:0;border-radius:999px;padding:5px 10px;font-size:13px;max-width:100%}
.tools label{font-size:12px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{background:var(--tint-soft);color:var(--tint);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:500}
.selbar{position:sticky;top:0;z-index:3;background:var(--tint);color:#fff;border-radius:12px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px;font-size:13px}
.selbar b{font-weight:600;margin-right:auto}
.selbar button{color:#fff;font-weight:600}
.selbar .seg{background:rgb(255 255 255 / .22)}
.selbar .seg button{color:#fff;font-weight:500;padding:3px 9px}
.selbar .seg button[aria-pressed="true"]{background:#fff;color:var(--tint)}
h3.sec{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.03em;color:var(--sub);margin:16px 12px 6px}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;min-height:44px;position:relative;width:100%;text-align:left}
.row+.row::before,.row+.kids::before,.kids+.row::before{content:"";position:absolute;top:0;left:12px;right:0;border-top:1px solid var(--sep)}
.kids{position:relative}
.kids .row{padding-left:30px}
.kids .kids .row{padding-left:48px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;overflow-wrap:anywhere}
.row .t span{display:block;color:var(--sub);font-size:12px;overflow-wrap:anywhere}
.row .n{color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .chev{color:var(--sub);font-size:18px;line-height:1;width:14px;text-align:center;transition:transform .15s}
.row.open>.chev{transform:rotate(90deg)}
.ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sub);flex:none;display:grid;place-items:center;font-size:13px;color:#fff;line-height:1}
.ck.on{background:var(--tint);border-color:var(--tint)}
.ck.part{border-color:var(--tint);color:var(--tint)}
.info{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--tint);color:var(--tint);font:italic 600 14px Georgia,serif;flex:none}
.more{color:var(--tint);padding:9px 12px 9px 30px;display:block;width:100%;text-align:left}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;white-space:nowrap}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}.badge.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}.badge.mut{color:var(--sub);background:var(--fill)}
.back{color:var(--tint);font-size:16px;padding:6px 0;display:inline-flex;gap:4px;align-items:center}
.roomhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:4px 4px 10px}
.roomhead .no{font-size:30px;font-weight:700;letter-spacing:-.02em}
.roomhead .nm{font-size:17px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--sep);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--card);padding:9px 12px}
.facts b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.facts span{font-size:11px;color:var(--sub)}
.kv{display:flex;gap:12px;padding:9px 12px;position:relative}
.kv+.kv::before{content:"";position:absolute;top:0;left:12px;right:0;border-top:1px solid var(--sep)}
.kv dt{color:var(--sub);flex:0 0 38%}.kv dd{margin:0;flex:1;min-width:0;overflow-wrap:anywhere;text-align:right}
dl{margin:0}
.lnk{color:var(--tint)}
.note{color:var(--sub);font-size:13px;margin:6px 12px}
.note li{margin-bottom:4px}
#sheet{position:absolute;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
#sheet .sh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--sep);background:var(--card)}
#sheet .sh b{flex:1;min-width:0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
#sheet .sh button{color:var(--tint);font-weight:600}
#sheet .sb{flex:1;overflow:auto;padding:4px 16px 30px}
.life .row .dotl{width:10px;height:10px;border-radius:50%;border:2px solid var(--sep);flex:none}
.life .row.done .dotl{background:var(--ok);border-color:var(--ok)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;z-index:50;font-size:13px}
textarea{width:100%;height:150px;font:12px ui-monospace,Menlo,monospace;background:var(--fill);color:var(--fg);border:0;border-radius:10px;padding:8px}
@media (max-width:900px){html,body{height:auto}#app{display:block;height:auto}#left{padding:10px 10px 0}#vcard{height:46vh;flex:none}#side{border-left:0;min-height:60vh}#body{overflow:visible}#sheet{position:fixed}#plan{max-height:none}}
</style>
</head>
<body>
<section id="gate"><h2>MPB Asset Tracker</h2><p id="gmsg">Sign in with your Autodesk account. You see the models and data your ACC permissions allow.</p><button class="primary" id="signin" hidden>Sign in with Autodesk</button></section>
<div id="app" hidden>
 <div id="left">
  <section class="card" id="vcard"><div class="vbar"><span class="msg" id="vmsg">3D not loaded.</span>
   <button class="pillbtn on" id="vload">Load 3D</button><button class="pillbtn" id="vceil" aria-pressed="false" hidden>Cut at 2.6 m</button><button class="pillbtn" id="vall" hidden>Whole building</button></div>
   <div id="fv"></div><div id="dbar" hidden></div><div id="legend3d" hidden></div></section>
  <section class="card" id="pcard"><div class="vbar"><div class="seg" id="flseg"></div><span class="msg" id="pmsg"></span><button class="pillbtn" id="ptoggle">Hide plan</button></div>
   <div id="plan"></div><div id="fnleg"></div></section>
 </div>
 <aside id="side"><div id="head"><h1>MPB Asset Tracker</h1><p id="src"></p><div class="seg" id="tabs"></div></div><div id="body"></div><div id="sheet" hidden></div></aside>
</div>
<div id="toast" hidden></div>
<script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const CFG=window.CX_CONFIG,A=window.CX_AUTH;let D;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=v=>v==null||v===''?'':Number(v).toLocaleString('en-GB',{minimumFractionDigits:1,maximumFractionDigits:1});
const FL=['BG','1e','2e','3e'],FLN=['Ground floor','1st floor','2nd floor','3rd floor'];
const FN={lab:['Laboratory','#34c759'],work:['Workshop','#ff9500'],off:['Office','#007aff'],meet:['Meeting','#5ac8fa'],can:['Canteen and kitchen','#ffcc00'],tec:['Technical','#ff3b30'],sto:['Storage','#a2845e'],circ:['Circulation','#8e8e93'],san:['Sanitary and changing','#af52de'],oth:['Other','#c7c7cc']};
const PAL=['#007aff','#ff9500','#34c759','#af52de','#ff2d55','#00c7be','#ffcc00','#a2845e','#5856d6','#ff6482'];
const ST={ok:['In model','ok'],list:['Not in model','crit'],lift:['Lift door','mut'],extra:['Not on door list','warn']};
const yn=v=>v==null||v===''?'unknown':({ja:'yes',nee:'no',nvt:'n/a'}[v]||String(v));
const nat=(a,b)=>String(a).localeCompare(String(b),'en',{numeric:true});
const RI={};let roomDoors=[],roomAssets=[];const dIdx={},aIdx={};
const S={tab:'rooms',fl:0,room:null,rq:'',rgroup:'fl',fnsel:null,mode:'ghost'};
const rlabel=n=>n+' '+(RI[n]!=null?D.rooms[RI[n]].name:'');
/* ---------- list engine: fields usable for grouping and filtering ---------- */
const FIELDS={doors:[['fl','Floor',d=>FLN[d.fl]],['st','Model status',d=>ST[d.st][0]],['side','Position',d=>d.side=='buiten'?'Exterior':'Interior'],['fam','Door family',d=>d.fam],['merk','Nunc mark',d=>d.merk||'(no mark)'],
  ['type','Type',d=>d.deurtype||d.lib||'unknown'],['size','Size W × H',d=>d.b?d.b+' × '+d.h:'unknown'],['fire','Fire rating',d=>d.fire===''||d.fire==null?'not stated':d.fire=='nvt'?'none':d.fire+' min'],
  ['tag','Card reader',d=>yn(d.tag)],['auto','Automatic',d=>yn(d.auto)],['vlucht','Escape door',d=>yn(d.vlucht)],['dranger','Door closer',d=>yn(d.dranger)],['kl','Colour',d=>d.kleurtxt||d.mkl||'unknown'],
  ['room','Room',d=>d.rooms.length?d.rooms.map(rlabel):['no room']],['fn','Room function',d=>d.rooms.length?[...new Set(d.rooms.map(n=>FN[D.rooms[RI[n]].fn][0]))]:['no room']],['chk','Open points',d=>d.chk.length||d.note?'has open points':'none']],
 assets:[['cat','Category',a=>D.cats[a[0]]],['pkg','Package',a=>D.pk[a[0]]],['type','Type',a=>D.labels[a[1]]],['fl','Floor',a=>FLN[a[6]]],['room','Room',a=>a[2]>=0?rlabel(D.rooms[a[2]].no):'no room'],
  ['fn','Room function',a=>a[2]>=0?FN[D.rooms[a[2]].fn][0]:'no room'],['mod','Source model',a=>'3D-66A-'+D.mods[a[5]]]]};
const LS={doors:{q:'',g:['fl',''],f:{},sel:new Set(),open:new Set(),more:new Set()},assets:{q:'',g:['cat','type'],f:{},sel:new Set(),open:new Set(),more:new Set()}};
const src=k=>k=='doors'?D.doors:D.assets,fdef=(k,f)=>FIELDS[k].find(x=>x[0]==f);
const VC={doors:{},assets:{}};
function vals(k,i,f){const c=VC[k][f]??=[];if(c[i]===undefined){const v=fdef(k,f)[2](src(k)[i]);c[i]=Array.isArray(v)?v:[v]}return c[i]}
const TXT={doors:[],assets:[]};
function text(k,i){return TXT[k][i]??=(k=='doors'?(d=>[d.nr,d.merk,d.inst,d.deurtype,d.lib,d.rooms.map(rlabel).join(' '),d.guid].join(' '))(D.doors[i]):(a=>[D.labels[a[1]],D.cats[a[0]],a[4],a[2]>=0?rlabel(D.rooms[a[2]].no):'',a[3]].join(' '))(D.assets[i])).toLowerCase()}
function items(k){const L=LS[k],q=L.q.trim().toLowerCase(),fs=Object.entries(L.f).filter(e=>e[1].size),out=[];
 for(let i=0;i<src(k).length;i++){if(q&&!text(k,i).includes(q))continue;let ok=true;for(const[f,set]of fs){if(!vals(k,i,f).some(v=>set.has(v))){ok=false;break}}if(ok)out.push(i)}return out}
function groupBy(k,its,f){const m=new Map();for(const i of its)for(const v of vals(k,i,f)){let a=m.get(v);if(!a)m.set(v,a=[]);a.push(i)}return[...m.entries()].sort(f=='fl'?(a,b)=>FLN.indexOf(a[0])-FLN.indexOf(b[0]):(a,b)=>nat(a[0],b[0]))}
let GK=[];
function ck(k,its){const s=LS[k].sel;let n=0;for(const i of its)if(s.has(i))n++;return n==0?'<span class="ck"></span>':n==its.length?'<span class="ck on">✓</span>':'<span class="ck part">–</span>'}
function leaf(k,i){const on=LS[k].sel.has(i);let t,s,b='';
 if(k=='doors'){const d=D.doors[i];t=d.nr||d.merk||'Door';s=[d.nr?d.merk:'',d.deurtype||d.lib,d.b?d.b+'×'+d.h:'',d.rooms.join(' / ')].filter(Boolean).join(' · ');b=d.st!='ok'?`<span class="badge ${ST[d.st][1]}">${ST[d.st][0]}</span>`:''}
 else{const a=D.assets[i];t=a[4]||D.labels[a[1]];s=[a[4]?D.labels[a[1]]:'',a[2]>=0?rlabel(D.rooms[a[2]].no):FLN[a[6]]].filter(Boolean).join(' · ')}
 return `<div class="row" data-item="${k}:${i}"><span class="ck${on?' on':''}">${on?'✓':''}</span><div class="t"><b>${esc(t)}</b><span>${esc(s)}</span></div>${b}<button class="info" data-pass="${k}:${i}" aria-label="Open passport">i</button></div>`}
function leaves(k,its,key){const L=LS[k],lim=L.more.has(key)?its.length:60;return its.slice(0,lim).map(i=>leaf(k,i)).join('')+(its.length>lim?`<button class="more" data-more="${esc(key)}">Show all ${its.length}</button>`:'')}
function tree(k,its){const L=LS[k],g1=L.g[0],g2=L.g[1];if(!g1)return `<div class="list">${leaves(k,its,'*')||'<div class="row"><div class="t"><span>Nothing matches.</span></div></div>'}</div>`;
 const out=[];for(const[v,a]of groupBy(k,its,g1)){const key=v,op=L.open.has(key);GK.push([k,a]);
  out.push(`<div class="row${op?' open':''}" data-open="${esc(key)}"><button data-selg="${GK.length-1}" aria-label="Select group">${ck(k,a)}</button><div class="t"><b>${esc(v)}</b></div><span class="n">${a.length}</span><span class="chev">›</span></div>`);
  if(op){let inner='';if(g2&&g2!=g1){for(const[v2,a2]of groupBy(k,a,g2)){const key2=key+'\u0001'+v2,op2=L.open.has(key2);GK.push([k,a2]);
     inner+=`<div class="row${op2?' open':''}" data-open="${esc(key2)}"><button data-selg="${GK.length-1}" aria-label="Select group">${ck(k,a2)}</button><div class="t"><b>${esc(v2)}</b></div><span class="n">${a2.length}</span><span class="chev">›</span></div>`;
     if(op2)inner+=`<div class="kids">${leaves(k,a2,key2)}</div>`}}else inner=leaves(k,a,key);
   out.push(`<div class="kids">${inner}</div>`)}}
 return `<div class="list">${out.join('')||'<div class="row"><div class="t"><span>Nothing matches.</span></div></div>'}</div>`}
function selbar(){const n=LS.doors.sel.size+LS.assets.sel.size;if(!n)return'';
 return `<div class="selbar"><b>${n.toLocaleString('en-GB')} selected</b><div class="seg" role="group" aria-label="Other objects">${[['ghost','Ghost'],['hide','Hide'],['show','Show']].map(m=>`<button data-mode="${m[0]}" aria-pressed="${S.mode==m[0]}">${m[1]}</button>`).join('')}</div><button data-clear>Clear</button></div>`}
function listView(k){GK=[];const L=LS[k],its=items(k),opt=(cur,none)=>(none?`<option value="">${none}</option>`:'')+FIELDS[k].map(f=>`<option value="${f[0]}"${cur==f[0]?' selected':''}>${f[1]}</option>`).join('');
 GK.push([k,its]);const chips=Object.entries(L.f).flatMap(([f,set])=>[...set].map(v=>`<button class="chip" data-unf="${f}\u0001${esc(v)}">${esc(fdef(k,f)[1])}: ${esc(v)} ✕</button>`)).join('');
 return `<input class="search" type="search" id="lq" placeholder="Search ${k=='doors'?'doors':'equipment'}" value="${esc(L.q)}" aria-label="Search">
 <div class="tools"><label for="g1">Group</label><select id="g1">${opt(L.g[0],'None')}</select><label for="g2">then</label><select id="g2">${opt(L.g[1],'None')}</select>
 <button class="pillbtn${chips?' on':''}" data-filter="${k}">Filter${chips?' ('+Object.values(L.f).reduce((s,x)=>s+x.size,0)+')':''}</button><button class="pillbtn" data-selg="0">Select all ${its.length.toLocaleString('en-GB')}</button><button class="pillbtn" data-copy="${k}">Copy for Excel</button><button class="pillbtn" data-link>Copy link</button></div>
 ${chips?`<div class="chips">${chips}</div>`:''}${selbar()}<div id="copybox" hidden><p class="note">Copying was blocked. Select the text below and copy it.</p><textarea id="copytxt" readonly aria-label="Table as text"></textarea></div>${tree(k,its)}`}
/* ---------- rooms ---------- */

const IC={csa:'<path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6M3 20h18"/>',ffe:'<path d="M6 11V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5M4 11h16v5H4zM6 16v4M18 16v4"/>',
 hvac:'<circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-6 3-6s3 3 0 6M14 12c4 0 6 1 6 3s-3 3-6 0M12 14c0 4-1 6-3 6s-3-3 0-6M10 12c-4 0-6-1-6-3s3-3 6 0"/>',
 el:'<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>',phe:'<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>',
 ff:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',conv:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 10 3-3 3 3M9 14l3 3 3-3"/>',
 ceil:'<path d="m12 4 9 4-9 4-9-4zM3 12l9 4 9-4M3 16l9 4 9-4"/>',files:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'};
const DISC=[['csa','CSA: architecture and structure'],['ffe','Furniture and lab equipment'],['hvac','HVAC'],['el','Electrical and instrumentation'],['phe','Plumbing, drainage and piping'],['ff','Fire fighting'],['conv','Conveying: lifts and hoists']];
function discOf(n){const m=n.match(/^3D-\d\d[A-Z]-([A-Z]{2})-(\d\d)/),c=m?m[1]:'',k=m?+m[2]:0;
 if(c=='AR')return k==1||k==2||k==6?'csa':'ffe';if(/^(ST|CI|FA)$/.test(c)||/Dakplaten|grids|Grids/i.test(n))return'csa';if(c=='HV'||c=='ME')return'hvac';if(c=='EL'||c=='IN')return'el';
 if(c=='PH'||c=='PI')return'phe';if(c=='FF')return'ff';if(c=='VT'||c=='OH')return'conv';return CFG.otherFiles&&CFG.otherFiles[n]||'csa'}
const V=(function(){let viewer=null,M=null,busy=null,low=false,cut=null,T=null,mute=false,g2id={},id2g={},tops=[],ceilIds=[];
 const say=t=>$('#vmsg').textContent=t,off={},fileOff=new Set();let ceilGhost=true;
 function init(){return busy||=(async()=>{$('#vload').hidden=true;say('Starting the viewer…');
  try{const getToken=async cb=>{const t=await A.token();if(!t)return A.login();cb(t.access,Math.floor((t.exp-Date.now())/1000))};
   await new Promise(res=>Autodesk.Viewing.Initializer({env:'AutodeskProduction2',api:CFG.viewerApi,getAccessToken:getToken},res));
   viewer=new Autodesk.Viewing.GuiViewer3D($('#fv'),{extensions:[]});viewer.start();viewer.setGhosting(true);viewer.setGroundShadow(false);viewer.setLightPreset(1);viewer.setQualityLevel(false,true);viewer.setOptimizeNavigation(true);
   try{viewer.setTheme(matchMedia('(prefers-color-scheme: dark)').matches?'dark-theme':'light-theme')}catch(e){}
   viewer.addEventListener(Autodesk.Viewing.AGGREGATE_SELECTION_CHANGED_EVENT,onPick);
   say('Finding the coordination model…');const tip=await A.api('/data/v1/projects/'+CFG.projectId+'/items/'+encodeURIComponent(CFG.nwdItem)+'/tip');const vn=tip.data.attributes.versionNumber;
   const urn=btoa(tip.data.id).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');say('Loading the coordination model v'+vn+'. This takes a minute or two…');
   M=await new Promise((res,rej)=>Autodesk.Viewing.Document.load('urn:'+urn,async doc=>{const g=doc.getRoot().getDefaultGeometry()||doc.getRoot().search({type:'geometry',role:'3d'})[0];if(!g)return rej(new Error('no 3D view in the coordination model'));
    try{res(await viewer.loadDocumentNode(doc,g,{}))}catch(e){rej(e)}},(c,msg)=>rej(new Error(msg||'code '+c))));
   const prog=ev=>{if(ev.model===M||!ev.model)say('Loading the coordination model v'+vn+': '+Math.round(ev.percent||0)+'%')};viewer.addEventListener(Autodesk.Viewing.PROGRESS_UPDATE_EVENT,prog);
   await new Promise(r=>M.getObjectTree(r,r));
   if(!M.isLoadDone())await new Promise(r=>{const E=Autodesk.Viewing.GEOMETRY_LOADED_EVENT,h=ev=>{if(ev.model===M){viewer.removeEventListener(E,h);r()}};viewer.addEventListener(E,h)});
   viewer.removeEventListener(Autodesk.Viewing.PROGRESS_UPDATE_EVENT,prog);say('Linking objects…');
   g2id=await M.getPropertyDb().executeUserFunction(function(pdb){var ai=[];pdb.enumAttributes(function(i,def){var nm=def.displayName||def.name;if((/^(ifcguid|ifc guid)$/i.test(nm)||/parameter_IfcGUID$/i.test(def.name))&&!/type/i.test(def.category||''))ai.push(i)});var out={};pdb.enumObjects(function(dbId){pdb.enumObjectProperties(dbId,function(a,v){if(ai.indexOf(a)>=0){var g=pdb.getAttrValue(a,v);if(!(g in out))out[g]=dbId}})});return out});
   id2g={};for(const g in g2id)id2g[g2id[g]]=g;
   const it=M.getInstanceTree();const ch=id=>{const a=[];it.enumNodeChildren(id,c=>{a.push(c)});return a};let kids=ch(it.getRootId());for(let n=0;n<4&&kids.length==1&&!/\.(ifc|dwg|nwc|rvt)$/i.test(it.getNodeName(kids[0])||'');n++)kids=ch(kids[0]);
   tops=kids.map(id=>({id,name:it.getNodeName(id)||''})).map(t=>({...t,disc:discOf(t.name)}));ceilIds=(D.ceil||[]).map(g=>g2id[g]).filter(x=>x!=null);
   calibrate();bg();window.__v={viewer,M,tops,g2id};['#vceil','#vall','#dbar'].forEach(q=>$(q).hidden=false);dbar();
   const nd=D.doors.filter(d=>d.guid&&g2id[d.guid]!=null).length,na=D.assets.filter(a=>g2id[a[3]]!=null).length;
   await apply(true);if(!(LS.doors.sel.size+LS.assets.sel.size)){if(S.room!=null&&S.roomOpen)room(S.room)}
   say('Coordination model v'+vn+' loaded: '+tops.length+' files. '+nd+' doors and '+na.toLocaleString('en-GB')+' equipment objects linked.')}
  catch(e){console.error(e);say('The 3D model could not be loaded: '+e.message);$('#vload').hidden=false;viewer=null;busy=null}})()}
 function bg(){try{const dk=matchMedia('(prefers-color-scheme: dark)').matches;viewer.setEnvMapBackground(false);dk?viewer.setBackgroundColor(44,44,46,20,20,22):viewer.setBackgroundColor(250,250,252,226,228,234)}catch(e){}}
 function bounds(id){const it=M.getInstanceTree(),fl=M.getFragmentList(),b=new THREE.Box3(),fb=new THREE.Box3();it.enumNodeFragments(id,f=>{fl.getWorldBounds(f,fb);b.union(fb)},true);return b}
 function calibrate(){const Pp=[];for(const d of D.doors){const id=d.guid&&g2id[d.guid];if(id==null||!d.bb)continue;const b=bounds(id);if(b.isEmpty())continue;const c=b.getCenter(new THREE.Vector3());
   Pp.push([(d.bb[0]+d.bb[3])/2,(d.bb[1]+d.bb[4])/2,(d.bb[2]+d.bb[5])/2,c.x,c.y,c.z])}
  if(Pp.length<3){T=null;return}const n=Pp.length,mw=[0,0,0],mv=[0,0,0];Pp.forEach(p=>{for(let k=0;k<3;k++){mw[k]+=p[k]/n;mv[k]+=p[3+k]/n}});
  let ar=0,ai=0,den=0;Pp.forEach(p=>{const wx=p[0]-mw[0],wy=p[1]-mw[1],vx=p[3]-mv[0],vy=p[4]-mv[1];ar+=vx*wx+vy*wy;ai+=vy*wx-vx*wy;den+=wx*wx+wy*wy});ar/=den;ai/=den;
  const s=Math.hypot(ar,ai);T={ar,ai,s,bx:mv[0]-(ar*mw[0]-ai*mw[1]),by:mv[1]-(ai*mw[0]+ar*mw[1]),bz:mv[2]-s*mw[2]};
  let err=0;Pp.forEach(p=>{const q=w2v(p[0],p[1],p[2]);err=Math.max(err,Math.hypot(q.x-p[3],q.y-p[4],q.z-p[5]))});window.__cal={n,err,s}}
 const w2v=(x,y,z)=>new THREE.Vector3(T.ar*x-T.ai*y+T.bx,T.ai*x+T.ar*y+T.by,T.s*z+T.bz);
 const LEVZ=[1.6,6.6,11.6,16.6,22.4];
 function room(i){if(!viewer||!T)return;cut={room:i};const r=D.rooms[i],b=new THREE.Box3(),top=low?(r.z0+Math.min(r.h,2.6)):(LEVZ[r.fl+1]-.55);
  r.poly.forEach(p=>{b.expandByPoint(w2v(p[0],p[1],r.z0-.15));b.expandByPoint(w2v(p[0],p[1],top))});b.expandByScalar(.25*T.s);
  viewer.setCutPlanes([new THREE.Vector4(1,0,0,-b.max.x),new THREE.Vector4(-1,0,0,b.min.x),new THREE.Vector4(0,1,0,-b.max.y),new THREE.Vector4(0,-1,0,b.min.y),new THREE.Vector4(0,0,1,-b.max.z),new THREE.Vector4(0,0,-1,b.min.z)]);
  const c=b.getCenter(new THREE.Vector3()),sz=b.getSize(new THREE.Vector3()),d=Math.max(sz.x,sz.y)*1.1+sz.z;
  viewer.navigation.setView(new THREE.Vector3(c.x-d*.45,c.y-d*.6,c.z+d*.9),c);viewer.navigation.setWorldUpVector(new THREE.Vector3(0,0,1));viewer.navigation.fitBounds(true,b)}
 // section through one floor: everything below the floor and above the ceiling zone is cut away
 function floor(f,keepView){if(!viewer||!T)return;cut={floor:f};const z0=w2v(0,0,LEVZ[f]-.35).z,z1=w2v(0,0,low?LEVZ[f]+2.6:LEVZ[f+1]-.55).z;
  viewer.setCutPlanes([new THREE.Vector4(0,0,1,-z1),new THREE.Vector4(0,0,-1,z0)]);if(keepView)return;
  const b=new THREE.Box3();D.rooms.forEach(r=>{if(r.fl==f)r.poly.forEach(p=>{b.expandByPoint(w2v(p[0],p[1],LEVZ[f]));b.expandByPoint(w2v(p[0],p[1],LEVZ[f]+3))})});
  const c=b.getCenter(new THREE.Vector3()),sz=b.getSize(new THREE.Vector3()),d=Math.max(sz.x,sz.y)*.75;
  viewer.navigation.setView(new THREE.Vector3(c.x-d*.55,c.y-d*.2,c.z+d*.8),c);viewer.navigation.setWorldUpVector(new THREE.Vector3(0,0,1));viewer.navigation.fitBounds(true,b)}
 function recut(){if(cut&&cut.room!=null)room(cut.room);else if(cut&&cut.floor!=null)floor(cut.floor,true)}
 function all(){if(!viewer)return;cut=null;viewer.setCutPlanes([]);viewer.fitToView()}
 // discipline and file visibility: switched-off files are fully invisible, also when the rest is ghosted
 function vis(){if(!M)return;const vm=M.visibilityManager;for(const t of tops)vm.setNodeOff(t.id,!!off[t.disc]||fileOff.has(t.name));viewer.impl.invalidate(true,true,true);dbar()}
 function dbar(){const n={};tops.forEach(t=>n[t.disc]=(n[t.disc]||0)+1);
  $('#dbar').innerHTML=DISC.filter(d=>n[d[0]]).map(d=>`<button data-disc="${d[0]}" aria-pressed="${!off[d[0]]}" title="${d[1]}" aria-label="${d[1]}"><svg viewBox="0 0 24 24">${IC[d[0]]}</svg></button>`).join('')+
   `<i></i><button data-ceilg aria-pressed="${ceilGhost}" title="Ceilings transparent" aria-label="Ceilings transparent"><svg viewBox="0 0 24 24">${IC.ceil}</svg></button><button data-files title="Show or hide single files" aria-label="Show or hide single files"><svg viewBox="0 0 24 24">${IC.files}</svg></button>`}
 function fileSheet(){sheet('Files in the coordination model',`<p class="note">Each file of the coordination model, grouped by discipline. Untick a file to take it out of the 3D view.</p>`+DISC.map(d=>{const fs=tops.filter(t=>t.disc==d[0]).sort((a,b)=>nat(a.name,b.name));if(!fs.length)return'';
   return `<h3 class="sec">${d[1]}${off[d[0]]?' · switched off':''}</h3><div class="list">${fs.map(t=>`<button class="row" data-ftog="${esc(t.name)}"><span class="ck${fileOff.has(t.name)?'':' on'}">${fileOff.has(t.name)?'':'✓'}</span><div class="t"><b>${esc(t.name)}</b></div></button>`).join('')}</div>`}).join(''))}
 const gid=(k,i)=>k=='doors'?D.doors[i].guid:D.assets[i][3];
 // highlight the selection, ghost or hide the rest; one colour per value of the first group field
 async function apply(fit){const total=LS.doors.sel.size+LS.assets.sel.size;if(!viewer||!M){if(total)init();return}
  const leg=new Map(),ids=[];let miss=0;viewer.clearThemingColors(M);const pend=[];
  for(const k of['doors','assets']){const L=LS[k];if(!L.sel.size)continue;const gf=L.g[0];
   for(const i of L.sel){const g=gid(k,i),id=g?g2id[g]:null;if(id==null){miss++;continue}const key=gf?vals(k,i,gf)[0]:(k=='doors'?'Doors':'Equipment');let e=leg.get(key);if(!e)leg.set(key,e={n:0});e.n++;ids.push(id);pend.push([id,key])}}
  const keys=[...leg.keys()].sort(nat),multi=keys.length>1&&keys.length<=PAL.length;keys.forEach((k,i)=>leg.get(k).c=new THREE.Color(multi?PAL[i]:PAL[0]));
  for(const[id,key]of pend){const c=leg.get(key).c;try{viewer.setThemingColor(id,new THREE.Vector4(c.r,c.g,c.b,1),M,true)}catch(e){}}
  mute=true;viewer.clearSelection();
  if(!ids.length||S.mode=='show'){viewer.setGhosting(true);viewer.isolate([],M);if(ceilGhost&&ceilIds.length)viewer.hide(ceilIds,M)}
  else{viewer.setGhosting(S.mode=='ghost');viewer.isolate(ids,M)}
  mute=false;vis();
  const lg=$('#legend3d');if(total){lg.hidden=false;lg.innerHTML=(multi?keys:[keys.length>1?keys.length+' groups':keys[0]||'Selection']).map((k,i)=>`<div><span class="sw" style="background:${multi?PAL[i]:PAL[0]}"></span>${esc(k)} · ${multi?leg.get(k).n:total-miss}</div>`).join('')}else lg.hidden=true;
  if(ids.length&&fit&&!cut)try{const bx=new THREE.Box3();let n=0;for(const id of ids){if(n++>600)break;bx.union(bounds(id))}if(bx.isEmpty())viewer.fitToView(ids,M);else{bx.expandByScalar(.6*T.s);const c=bx.getCenter(new THREE.Vector3()),sz=bx.getSize(new THREE.Vector3()),d=Math.max(sz.x,sz.y)*.9+sz.z;viewer.navigation.setView(new THREE.Vector3(c.x-d*.5,c.y-d*.65,c.z+d*.75),c);viewer.navigation.setWorldUpVector(new THREE.Vector3(0,0,1));viewer.navigation.fitBounds(true,bx)}}catch(e){console.warn(e)}
  say((total?(total-miss).toLocaleString('en-GB')+' objects highlighted'+(miss?', '+miss+' not in the 3D model':'')+'.':'Nothing selected.')+(cut?' Section: '+(cut.room!=null?'room '+D.rooms[cut.room].no:FLN[cut.floor])+'.':''))}
 function focus(k,i){if(!viewer||!M)return;const g=gid(k,i),id=g?g2id[g]:null;if(id==null)return;mute=true;viewer.select([id],M);mute=false;viewer.fitToView([id],M)}
 function onPick(ev){if(mute)return;const s=ev.selections&&ev.selections[0];if(!s||!s.dbIdArray.length)return;const it=M.getInstanceTree();let id=s.dbIdArray[0],g=null;
  for(let k=0;k<8&&id;k++){g=id2g[id];if(g&&(aIdx[g]!=null||dIdx[g]!=null))break;g=null;id=it.getNodeParentId(id)}
  if(!g)return;if(dIdx[g]!=null)doorPass(dIdx[g],true);else assetPass(aIdx[g],true)}
 document.addEventListener('click',e=>{const t=e.target.closest('#vload,#vall,#vceil,[data-disc],[data-ceilg],[data-files],[data-ftog]');if(!t)return;const d=t.dataset;
  if(t.id=='vload')init();else if(t.id=='vall')all();else if(t.id=='vceil'){low=!low;t.setAttribute('aria-pressed',low);recut()}
  else if(d.disc){off[d.disc]=!off[d.disc];vis()}else if('ceilg' in d){ceilGhost=!ceilGhost;apply(false)}else if('files' in d)fileSheet()
  else if(d.ftog){fileOff.has(d.ftog)?fileOff.delete(d.ftog):fileOff.add(d.ftog);vis();const sb=$('#sheet .sb'),st=sb.scrollTop;fileSheet();$('#sheet .sb').scrollTop=st}});
 return{init,room,floor,all,apply,focus,resize(){viewer&&setTimeout(()=>viewer.resize(),50)}}})();
/* ---------- start ---------- */
(async function(){const gm=$('#gmsg');
 try{const t=await A.init();if(!t){$('#signin').hidden=false;$('#signin').onclick=()=>A.login();return}
  gm.textContent='Reading the data file from ACC…';D=await A.readDataFile(CFG.dataFile);
  if(!D){gm.textContent='The data file '+CFG.dataFile+' was not found in the ACC folder Internal Check > Cx Viewer data, or you have no access to that folder.';return}
  D.rooms.forEach((r,i)=>RI[r.no]=i);roomDoors=D.rooms.map(()=>[]);roomAssets=D.rooms.map(()=>[]);
  D.doors.forEach((d,i)=>{d.rooms.forEach(n=>RI[n]!=null&&roomDoors[RI[n]].push(i));if(d.guid)dIdx[d.guid]=i});D.assets.forEach((a,i)=>{if(a[2]>=0)roomAssets[a[2]].push(i);aIdx[a[3]]=i});
  planInit();$('#src').textContent='Model v'+D.nwd[0]+' of '+D.nwd[1]+' · data built '+D.built+' · door numbers provisional';
  const q=new URLSearchParams(location.search).get('s');if(q){try{restore(JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g,'+').replace(/_/g,'/'))))))}catch(e){}}
  $('#gate').hidden=true;$('#app').hidden=false;render();if(q)V.init();
 }catch(e){console.error(e);gm.textContent='Could not start: '+e.message;$('#signin').hidden=false;$('#signin').textContent='Sign in again';$('#signin').onclick=()=>A.login()}})();
</script>
