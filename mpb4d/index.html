<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPB Build Sequence</title>
<link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: toolbar rows on top (zones, view options); model viewer + side panel in the middle; inventory grid with Gantt bars at the bottom. */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#18222b; --mute:#5c6b78; --line:#d3dae0; --view:#dfe5ea;
  --accent:#0b6e8e; --ghost:#cfd7dd; --built:#9aa5ae; --cursor:#d1495b; --rowalt:#f6f8f9; --selrow:#dbeef5;
  --f-body:"Barlow",system-ui,sans-serif; --f-lab:"Barlow Condensed","Arial Narrow",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12181d; --panel:#1a2229; --ink:#e6ecf0; --mute:#93a2af; --line:#2c3842; --view:#0d1216;
  --accent:#4fb6d6; --ghost:#27323b; --built:#56636e; --cursor:#ff6b7d; --rowalt:#1e2830; --selrow:#17384a; color-scheme:dark } }
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{font-family:var(--f-lab);font-weight:600;font-size:19px;letter-spacing:.02em;margin:0 6px 0 0;white-space:nowrap}
.lab{font-family:var(--f-lab);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:4px 9px;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--rowalt)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=search],input[type=text]{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:4px 6px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1 1 300px;min-width:0}
#play{min-width:64px;font-weight:600}
#slider{flex:1 1 120px;min-width:80px;accent-color:var(--accent)}
#date{font-family:var(--f-num);font-weight:500;font-size:15px}
.note{background:color-mix(in srgb,var(--cursor) 12%,var(--panel));border-bottom:1px solid var(--line);padding:4px 14px;font-size:12.5px}
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1.2fr) minmax(0,1fr)}
#view{position:relative;background:var(--view);min-height:0;overflow:hidden}
#fv{position:absolute;inset:0}
#load{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 16px;max-width:80%;text-align:center}
#signin{position:absolute;left:50%;top:56%;transform:translateX(-50%);z-index:5}
.legend{position:absolute;left:10px;top:8px;z-index:4;display:flex;flex-direction:column;gap:2px;font-size:11.5px;pointer-events:none;max-height:70%;overflow:hidden}
#rpanel{position:absolute;right:0;top:0;bottom:0;width:300px;max-width:92%;z-index:6;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px;font-size:12.5px;box-shadow:-6px 0 18px rgba(0,0,0,.18)}
#rpanel h3{font-family:var(--f-lab);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px;font-weight:600}
#rpanel .r{display:grid;grid-template-columns:112px minmax(0,1fr) 40px;align-items:center;gap:6px;min-height:26px}
#rpanel .r output{font-family:var(--f-num);font-size:11px;text-align:right;color:var(--mute)}
#rpanel input[type=range]{width:100%;accent-color:var(--accent)} #rpanel input[type=color]{width:44px;height:22px;padding:0;border:1px solid var(--line);border-radius:3px;background:none}
#rpanel select{width:100%} #rpanel textarea{width:100%;height:110px;font-family:var(--f-num);font-size:10.5px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);margin-top:6px}
#rpanel .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--panel) 82%,transparent);padding:1px 6px;border-radius:3px;width:max-content;max-width:240px}
.legend i{flex:0 0 9px;width:9px;height:9px;border-radius:2px;display:inline-block}
#side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{border:1px solid var(--line);border-radius:4px;padding:5px 7px}
.kpi b{display:block;font-family:var(--f-num);font-size:17px;font-weight:500}
h2{font-family:var(--f-lab);font-size:15px;font-weight:600;letter-spacing:.03em;margin:0 0 4px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-family:var(--f-lab);font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-size:11.5px}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--ghost);border:1px solid var(--mute)}
.st.s1{background:var(--cursor);border-color:var(--cursor)} .st.s2{background:var(--built);border-color:var(--built)}
.pbar{height:6px;background:var(--ghost);border-radius:3px;overflow:hidden;min-width:50px}.pbar i{display:block;height:100%}
#grid{grid-column:1 / -1;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#gbar{border-bottom:1px solid var(--line)}
#gantt{flex:1 1 auto;overflow:auto;position:relative;min-height:0}
.g{position:relative;min-width:max-content}
.ghead{position:sticky;top:0;z-index:3;display:flex;background:var(--panel);border-bottom:1px solid var(--line);height:24px}
.gl{position:sticky;left:0;z-index:2;flex:0 0 var(--lw);width:var(--lw);background:inherit;border-right:1px solid var(--line);display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.gl .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.gl .c{flex:0 0 62px;text-align:right;padding-right:8px;font-family:var(--f-num);font-size:11.5px;font-variant-numeric:tabular-nums}
.gl .c.q{flex-basis:92px}
.gt{position:relative;flex:0 0 auto}
.mon{position:absolute;top:0;height:24px;border-left:1px solid var(--line);padding:4px 5px 0;font-family:var(--f-lab);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.row{display:flex;height:22px;background:var(--panel);cursor:pointer;font-size:12.5px}
.row:nth-child(even){background:var(--rowalt)}
.row.gp{font-weight:600}
.row.sel,.row.sel:nth-child(even){background:var(--selrow)}
.row.sel .gl{box-shadow:inset 3px 0 0 var(--accent)}
.row em{font-style:normal;color:var(--mute);font-size:11.5px;font-weight:400}
.tw{flex:0 0 18px;text-align:center;font-size:10px;color:var(--mute);height:22px;line-height:22px}
.b{position:absolute;top:5px;height:12px;border-radius:2px;min-width:3px}
.row.gp .b{top:7px;height:8px;background:var(--ghost)}.row.gp .b i{display:block;height:100%;background:var(--built);border-radius:2px}
.b.s0{opacity:.38}.b.s2{filter:saturate(.45)}
.site{position:sticky;left:calc(var(--lw) + 8px);display:inline-block;margin-top:3px;font-family:var(--f-lab);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 6px;line-height:15px;background:var(--panel)}
#cur{position:absolute;top:0;bottom:0;width:13px;margin-left:-6px;z-index:4;cursor:ew-resize;touch-action:none}
#cur::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:3px;background:var(--cursor);border-radius:2px}
#cur b{position:sticky;top:3px;display:block;width:max-content;transform:translateX(-50%);margin-left:6px;background:var(--cursor);color:#fff;font-family:var(--f-num);font-size:11px;font-weight:500;padding:1px 6px;border-radius:3px;white-space:nowrap}
#today{position:absolute;top:24px;bottom:0;width:0;border-left:1px dashed var(--mute);z-index:1;pointer-events:none}
.ghead .gt{cursor:ew-resize;touch-action:none}
body.scrub{user-select:none;cursor:ew-resize}
#msg{color:var(--mute)}
@media (max-width:820px){
  html,body{height:auto} body{display:block} .main{display:block}
  #view{height:50vh;min-height:280px} #side{border-left:0;border-top:1px solid var(--line)} #grid{height:70vh}
  .gl .c{display:none}
}
</style></head><body>
<div class="bar">
  <h1>MPB Build Sequence</h1>
  <div class="ctl">
    <button class="btn" id="play" type="button">Play</button>
    <select id="speed" aria-label="Animation speed"><option value="7">1 week / s</option><option value="14" selected>2 weeks / s</option><option value="30">1 month / s</option></select>
    <input id="slider" type="range" min="0" max="100" value="0" aria-label="Programme date">
    <span id="date"></span>
  </div>
  <button class="btn on" id="t4d" type="button" title="Off: show the whole model regardless of dates">4D time: on</button>
  <label class="btn" for="file">Load planner Excel<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></label>
  <button class="btn" id="export" type="button">Export Excel</button>
</div>
<div class="bar" id="zbar"><span class="lab">Zone views</span></div>
<div class="bar" id="vbar">
  <div class="grp"><span class="lab">Colour by</span><select id="colorBy"><option value="real">Build status</option><option value="status">Status by discipline</option><option value="disc">Discipline</option><option value="pkg">Package</option><option value="zone">Zone</option><option value="floor">Floor</option><option value="group">Model item group</option></select></div>
  <div class="grp"><span class="lab">Selection</span><span class="seg" id="vis"><button type="button" data-v="normal" class="on">Highlight</button><button type="button" data-v="isolate">Isolate</button><button type="button" data-v="ghost">Ghost others</button><button type="button" data-v="hide">Hide</button></span><button class="btn" id="clear" type="button">Clear</button></div>
  <div class="grp"><span class="lab">Click selects</span><span class="seg" id="pick"><button type="button" data-v="tag" class="on">Group</button><button type="button" data-v="el">Element</button></span></div>
  <div class="grp"><button class="btn on" id="clip" type="button" title="Cut the model to the chosen zone">Section box: on</button><button class="btn on" id="ghost" type="button">Not started: ghosted</button><button class="btn" id="fit" type="button">Fit</button></div>
  <div class="grp"><button class="btn" id="rbtn" type="button">Render settings</button><button class="btn" id="orbit" type="button" title="Slowly turn the camera around the building while playing">Orbit: off</button></div>
  <div class="grp"><span class="lab">Saved views</span><select id="views"><option value="">—</option></select><button class="btn" id="vsave" type="button">Save</button><button class="btn" id="vdel" type="button">Delete</button></div>
</div>
<div class="note" id="note"><b id="dnote">Example dates.</b> <span id="msg"></span></div>
<div class="main">
  <div id="view"><div id="fv"></div><div id="load">Starting…</div><button class="btn on" id="signin" type="button" hidden>Sign in with Autodesk</button><div class="legend" id="legend"></div><div id="rpanel" hidden></div></div>
  <div id="side">
    <div class="kpis">
      <div class="kpi"><b id="k2">0</b><span class="lab">Built</span></div>
      <div class="kpi"><b id="k1">0</b><span class="lab">In progress</span></div>
      <div class="kpi"><b id="k0">0</b><span class="lab">To start</span></div>
    </div>
    <div id="selbox"></div>
  </div>
  <div id="grid">
    <div class="bar" id="gbar">
      <div class="grp"><span class="lab">Group by</span><select id="g1"></select><span class="lab">then</span><select id="g2"></select></div>
      <div class="grp"><span class="lab">Discipline</span><span class="seg" id="fdisc"></span></div>
      <input type="search" id="q" placeholder="Search tag, group, package" aria-label="Search">
      <button class="btn" id="expand" type="button">Expand all</button>
      <span class="lab" id="count"></span>
    </div>
    <div id="gantt"><div class="g" id="g"></div></div>
  </div>
</div>
<script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js?v=2026-10-06b"></script>
<script src="auth.js?v=2026-10-06b"></script>
<script>
(function(){
const DC={CI:'#8c8478',ST:'#5b6c8f',FA:'#2e86ab',AR:'#d9a021',HV:'#3aa17e',FF:'#d1495b',PH:'#7b5ea7',PI:'#e07a3f',EL:'#b0408f',FU:'#946b4a'};
const DN={CI:'Civil',ST:'Structure',FA:'Facade and roof',AR:'Interior',HV:'HVAC',FF:'Sprinkler',PH:'Plumbing',PI:'Lab gas',EL:'Electrical',FU:'Furniture and equipment'};
const PAL=['#2e86ab','#d9a021','#d1495b','#3aa17e','#7b5ea7','#e07a3f','#5b6c8f','#b0408f','#946b4a','#6aa84f','#c2185b','#00838f','#8d6e63','#5c6bc0','#f4b400','#455a64'];
const SN=['Not started','In progress','Built'];
const span=ts=>{const a=ts.filter(t=>!t.built); return a.length?[Math.min(...a.map(t=>t.s)),Math.max(...a.map(t=>t.f))]:null};
const DAY=864e5, $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const d2n=s=>Math.round(Date.parse(s+'T00:00:00Z')/DAY), n2s=n=>{const d=new Date(n*DAY);return String(d.getUTCDate()).padStart(2,'0')+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+d.getUTCFullYear()};
const num=v=>v.toLocaleString('en-GB'), fmt=(v,u)=>num(u==='no.'?Math.round(v):v>=100?Math.round(v):Math.round(v*10)/10)+' '+u;
const CFG=window.CX_CONFIG,A=window.CX_AUTH;
const store={get(k){try{return JSON.parse(localStorage.getItem('mpb4d.'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('mpb4d.'+k,JSON.stringify(v))}catch(e){}}};

let D,tags=null,T=0,t0=null,t1,playing=false,PX=3,LW=430;
// view state
const S={sel:new Set(),vis:'normal',colorBy:'real',pick:'tag',time:true,ghost:true,clip:true,zone:null,g1:'zone',g2:'',disc:new Set(),q:'',open:new Set()};
let viewer=null,models={},tagIds={},id2tag={},applied={},muting=false,boundsCache={};
const say=t=>{$('load').hidden=!t;$('load').textContent=t};

const floorOf=z=>{const m=/^(?:STR-)?(GF|1F|2F|3F)/.exec(z);return m?m[1]:(z==='ROOF'?'Roof':z==='SUB'?'Substructure':'Building')};
const KEY={zone:t=>t.zoneName,floor:t=>t.floor,block:t=>t.block,disc:t=>DN[t.disc],pkg:t=>t.pkg,group:t=>t.name,status:t=>SN[st(t)]};
const KN={zone:'Zone',floor:'Floor',block:'Shell / fit-out',disc:'Discipline',pkg:'Package',group:'Model item group',status:'Status'};

start().catch(e=>{say('Error: '+e.message);console.error(e)});

async function start(){
  const tok=await A.init();
  if(!tok){$('signin').hidden=false;$('signin').onclick=()=>A.login();say('Sign in with your Autodesk account to load the models.');return}
  say('Reading data from ACC…');
  const alt=n=>n.replace(/_/g,' '); const d=await A.readDataFile(CFG.dataFile)||await A.readDataFile(alt(CFG.dataFile));
  if(!d){say('The file '+CFG.dataFile+' was not found in the ACC data folder, or you have no access to that folder.');return}
  D=d; const zn=Object.fromEntries(D.zones.map(z=>[z[0],z]));
  tags=D.tags.map((t,i)=>({i,tag:t[0],zone:t[1],group:t[2],n:t[3],qty:t[4],unit:t[5],s:d2n(t[6]),f:d2n(t[7]),built:!!t[8],name:D.groups[t[2]][0],pkg:D.groups[t[2]][1],disc:D.groups[t[2]][2],
    zoneName:zn[t[1]][1],block:zn[t[1]][2]==='A'?'Shell':'Fit-out',floor:floorOf(t[1]),zo:D.zones.indexOf(zn[t[1]])}));
  try{const b=await A.readDataBlob(CFG.scheduleFile)||await A.readDataBlob(alt(CFG.scheduleFile)); if(b)readBook(await b.arrayBuffer(),CFG.scheduleFile+' in ACC')}catch(e){console.warn('no schedule file',e)}
  buildBars(); range(); bind(); setT(t0); refresh();
  await initViewer();
}
function range(){const ts=tags.filter(t=>!t.built); if(!ts.length)ts.push(...tags); t0=Math.min(...ts.map(t=>t.s))-7;t1=Math.max(...ts.map(t=>t.f))+14;$('slider').min=t0;$('slider').max=t1}
function st(t){return !S.time||t.built?2:T<t.s?0:T<=t.f?1:2}
function real(t){return t.built?2:T<t.s?0:T<=t.f?1:2}
function inZone(t){const z=S.zone; return !z||(z.length===2||z==='Roof'?t.floor===z:t.zone===z)}
function pass(t){if(!inZone(t))return false; if(S.disc.size&&!S.disc.has(t.disc))return false; if(S.q){const q=S.q.toLowerCase(); if(!(t.tag+' '+t.name+' '+t.pkg+' '+t.zoneName).toLowerCase().includes(q))return false} return true}

/* ---------- toolbars ---------- */
function buildBars(){
  // zone buttons from the zone list: All | per floor: floor button + its zones | shell zones
  const zb=$('zbar'); let h='<span class="lab">Zone views</span><span class="seg"><button type="button" data-z="">All</button></span>';
  for(const f of ['GF','1F','2F','3F']){const zs=D.zones.filter(z=>z[2]==='B'&&z[0].startsWith(f)&&tags.some(t=>t.zone===z[0])); if(!zs.length)continue;
    h+='<span class="seg"><button type="button" data-z="'+f+'" title="Whole floor"><b>'+f+'</b></button>'+zs.map(z=>'<button type="button" data-z="'+z[0]+'">'+esc(z[1].replace(/^.. - /,''))+'</button>').join('')+'</span>'}
  const sh=D.zones.filter(z=>z[2]==='A'&&tags.some(t=>t.zone===z[0]));
  h+='<span class="seg">'+sh.map(z=>'<button type="button" data-z="'+z[0]+'">'+esc(z[1])+'</button>').join('')+'</span>'; zb.innerHTML=h;
  zb.onclick=e=>{const b=e.target.closest('button[data-z]'); if(!b)return; S.zone=b.dataset.z||null; S.sel.clear(); if(S.zone){tree(); if(rows.filter(r=>!r.leaf).length<=3)rows.forEach(r=>{if(!r.leaf)S.open.add(r.path)})} refresh(); applyZone(); const sp=span(tags.filter(pass)); $('gantt').scrollLeft=sp?Math.max(0,(sp[0]-t0)*PX-40):0};
  const opts=Object.keys(KN).map(k=>'<option value="'+k+'">'+KN[k]+'</option>').join(''); $('g1').innerHTML=opts; $('g2').innerHTML='<option value="">(none)</option>'+opts; $('g1').value=S.g1; $('g2').value=S.g2;
  $('fdisc').innerHTML=Object.keys(DC).filter(k=>tags.some(t=>t.disc===k)).map(k=>'<button type="button" data-d="'+k+'" title="'+DN[k]+'">'+k+'</button>').join('');
  loadViews();
}
function syncBars(){
  document.querySelectorAll('#zbar button').forEach(b=>b.classList.toggle('on',(b.dataset.z||null)===S.zone));
  document.querySelectorAll('#vis button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.vis));
  document.querySelectorAll('#pick button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.pick));
  document.querySelectorAll('#fdisc button').forEach(b=>b.classList.toggle('on',S.disc.has(b.dataset.d)));
  $('t4d').classList.toggle('on',S.time); $('t4d').textContent='4D time: '+(S.time?'on':'off');
  $('clip').classList.toggle('on',S.clip); $('clip').textContent='Section box: '+(S.clip?'on':'off');
  $('ghost').classList.toggle('on',S.ghost); $('ghost').textContent='Not started: '+(S.ghost?'ghosted':'hidden');
  $('colorBy').value=S.colorBy; $('g1').value=S.g1; $('g2').value=S.g2; $('q').value=S.q;
}
function refresh(){syncBars(); buildGrid(); panel(); legend(); apply3D()}

/* ---------- inventory grid with Gantt bars ---------- */
let rows=[];
function tree(){
  const list=tags.filter(pass), levels=[S.g1,S.g2].filter((k,i,a)=>k&&a.indexOf(k)===i); rows=[];
  const walk=(ts,lv,path)=>{
    if(lv>=levels.length){ts.forEach(t=>rows.push({leaf:true,t,depth:lv,tags:[t]}));return}
    const k=levels[lv],m=new Map(); ts.forEach(t=>{const v=KEY[k](t); if(!m.has(v))m.set(v,[]); m.get(v).push(t)});
    let keys=[...m.keys()]; if(k!=='zone'&&k!=='floor'&&k!=='status')keys.sort(); if(k==='status')keys.sort((a,b)=>SN.indexOf(a)-SN.indexOf(b));
    for(const v of keys){const p=path+'/'+v,g=m.get(v); rows.push({leaf:false,label:v,path:p,depth:lv,tags:g,open:S.open.has(p)}); if(S.open.has(p))walk(g,lv+1,p)}
  };
  walk(list,0,''); return list;
}

  viewer.addEventListener(Autodesk.Viewing.GEOMETRY_LOADED_EVENT,ev=>{const m=ev.model; if(!m||!m._code||!models[m._code])return; try{viewer.hide(m.getRootId(),m)}catch(e){} applied={}; boundsCache={}; apply3D(); clearTimeout(refit); refit=setTimeout(()=>{if(S.zone||!moved)applyZone()},400)});

  for(const code of want){

    try{
      const m=await new Promise((res,rej)=>Autodesk.Viewing.Document.load('urn:'+urn,async doc=>{const g=doc.getRoot().search({type:'geometry',role:'3d'})[0]; if(!g)return rej(new Error('no 3D view'));

// link the IFC GlobalIds in the data file to this model's element ids (external id = GlobalId, children carry a /n suffix)
async function mapModel(code,m){
  const all=D.map[code].map(g=>g[1].split(' ')); let tot=0; all.forEach(a=>tot+=a.length);
  let e2id=await new Promise(r=>m.getExternalIdMapping(r,()=>r({})));
  let h=0; for(const a of all)for(const g of a)if(e2id[g]!=null)h++;
  if(h<tot*0.2){ // this translation keeps the IFC GlobalId as the property Element > IfcGUID: read it from the property database
    try{const alt=await m.getPropertyDb().executeUserFunction(function(pdb){var ai={},any={};pdb.enumAttributes(function(i,d){if(d.displayName==='IfcGUID'||/^(globalid|ifcguid)$/i.test(d.name)){any[i]=1;if(d.category==='Element')ai[i]=1}});
        if(!Object.keys(ai).length)ai=any; var out={};pdb.enumObjects(function(dbId){pdb.enumObjectProperties(dbId,function(a,v){if(ai[a]){var g=pdb.getAttrValue(a,v);if(g&&out[g]==null)out[g]=dbId}})});return out});
      if(alt&&Object.keys(alt).length)e2id=alt}catch(e){console.warn('IfcGUID property scan failed',code,e)}
  }
  let hit=0; tagIds[code]={}; id2tag[code]={};
  D.map[code].forEach((g,k)=>{const ids=[]; for(const guid of all[k]){const id=e2id[guid]; if(id!=null){ids.push(id);id2tag[code][id]=g[0];hit++}} tagIds[code][g[0]]=ids});
  await new Promise(r=>m.getObjectTree(()=>r(),()=>r()));
  viewer.hide(m.getRootId(),m);           // everything starts hidden; tags switch elements on
  return [code,tot,hit];
}

const v4=(hex,mix,to)=>{const c=new THREE.Color(hex); if(to)c.lerp(new THREE.Color(to),mix); return new THREE.Vector4(c.r,c.g,c.b,1)};
function apply3D(){
  if(!viewer||!tags)return; const builtC=css('--built'), hasSel=S.sel.size>0; let changed=false;
  const ghosting=S.vis==='ghost'&&hasSel || (S.ghost&&!(S.vis==='isolate'&&hasSel)); if(applied._g!==ghosting){viewer.setGhosting(ghosting);applied._g=ghosting;changed=true}
  tags.forEach(t=>{const s=st(t),isSel=S.sel.has(t.i);
    let show=pass(t)&&s>0; if(hasSel){if((S.vis==='isolate'||S.vis==='ghost')&&!isSel)show=false; if(S.vis==='hide'&&isSel)show=false}
    let col=''; if(show)col=S.colorBy==='real'?(s===1?'w'+R.wip+R.wipS:R.mat==='original'?'o':R.mat==='arctic'?'a':'t'+DC[t.disc]+R.tint):S.colorBy==='status'?(s===1?DC[t.disc]:'m'+DC[t.disc]):(colorMap[KEY[S.colorBy](t)]||'#999999');
    const key=show?col:'-'; if(applied[t.i]===key)return; applied[t.i]=key; changed=true;
    let c=null; if(show){const k0=col[0]; if(k0==='m')c=v4(col.slice(1),.6,builtC); else if(k0==='t'){c=v4(col.slice(1,8)); c.w=+R.tint} else if(k0==='w'){c=v4(R.wip); c.w=+R.wipS} else if(k0==='o')c=new THREE.Vector4(1,1,1,0); else if(k0==='a')c=new THREE.Vector4(.93,.94,.95,1); else c=v4(col)}
    for(const code in models){const ids=tagIds[code]&&tagIds[code][t.i]; if(!ids||!ids.length)continue; const m=models[code];
      if(!show)viewer.hide(ids,m); else{viewer.show(ids,m); const rec=!!(m.getInstanceTree&&m.getInstanceTree()); for(const id of ids){try{viewer.setThemingColor(id,c,m,rec)}catch(e){try{viewer.setThemingColor(id,c,m,false)}catch(e2){}}}}}});
  // blue highlight only in Highlight mode
  const hk=S.vis==='normal'?[...S.sel].sort().join(','):''; if(applied._h!==hk){applied._h=hk; muting=true; viewer.clearSelection();
    if(hk){const s=[]; for(const code in models){const ids=[]; S.sel.forEach(i=>{const a=tagIds[code]&&tagIds[code][i]; if(a&&applied[i]!=='-')for(const id of a)ids.push(id)}); if(ids.length)s.push({model:models[code],ids})} if(s.length)viewer.impl.selector.setAggregateSelection(s)}

}
function boundsOf(pred,key){
  if(boundsCache[key])return boundsCache[key]; const xs=[[],[],[],[],[],[]], b=new THREE.Box3();
  for(const code in models){const m=models[code],tree=m.getInstanceTree(),fl=m.getFragmentList(); if(!tree||!fl)continue;
    tags.filter(pred).forEach(t=>{const ids=tagIds[code][t.i]||[]; for(const id of ids)tree.enumNodeFragments(id,f=>{fl.getWorldBounds(f,b); if(b.min.x<=b.max.x){xs[0].push(b.min.x);xs[1].push(b.min.y);xs[2].push(b.min.z);xs[3].push(b.max.x);xs[4].push(b.max.y);xs[5].push(b.max.z)}},true)})}
  if(!xs[0].length)return null; const pc=(a,p)=>{a.sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.max(0,Math.floor(p*(a.length-1))))]};
  const lo=xs[0].length>200?.01:0, bx=new THREE.Box3(new THREE.Vector3(pc(xs[0],lo),pc(xs[1],lo),pc(xs[2],lo)),new THREE.Vector3(pc(xs[3],1-lo),pc(xs[4],1-lo),pc(xs[5],1-lo)));
  return boundsCache[key]=bx;
}
function applyZone(){

  if(S.clip&&zoned){const e=bx.clone().expandByScalar(Math.max(bx.max.x-bx.min.x,bx.max.y-bx.min.y)*0.004+0.05), P=[];
    P.push(new THREE.Vector4(0,0,1,-e.max.z),new THREE.Vector4(0,0,-1,e.min.z),new THREE.Vector4(1,0,0,-e.max.x),new THREE.Vector4(-1,0,0,e.min.x),new THREE.Vector4(0,1,0,-e.max.y),new THREE.Vector4(0,-1,0,e.min.y));

let cubed=false,moved=false,refit=0;
function look(bx){const go=()=>{try{viewer.navigation.fitBounds(true,bx)}catch(e){}}; if(!cubed){cubed=true; try{const x=viewer.getExtension('Autodesk.ViewCubeUi'); if(x){x.setViewCube('front top right'); setTimeout(go,900); return}}catch(e){}} go()}
function fit(){if(!viewer)return; const bx=boundsOf(pass,'f:'+S.zone+[...S.disc].join('')+S.q); if(bx)look(bx)}

function onPick(ev){
  if(muting||S.pick!=='tag')return; const s=ev.selections&&ev.selections[0]; if(!s||!s.dbIdArray.length)return; const m=s.model,map=id2tag[m._code]; if(!map)return;
  const tree=m.getInstanceTree(); let id=s.dbIdArray[0],k=0; while(id!=null&&map[id]==null&&tree&&k++<12)id=tree.getNodeParentId(id);

  let p=''; [S.g1,S.g2].filter((k,i,a)=>k&&a.indexOf(k)===i).forEach(k=>{p+='/'+KEY[k](t);S.open.add(p)});
  applied._h=null; buildGrid(); panel(); apply3D(); const i=rows.findIndex(r=>r.leaf&&r.t===t), el=document.querySelector('#g .row[data-i="'+i+'"]'); if(el)el.scrollIntoView({block:'nearest'});
}

/* ---------- saved views ---------- */
function snap(){return {sel:[...S.sel].map(i=>tags[i].tag),vis:S.vis,colorBy:S.colorBy,time:S.time,ghost:S.ghost,clip:S.clip,zone:S.zone,g1:S.g1,g2:S.g2,disc:[...S.disc],q:S.q,open:[...S.open],T,cam:viewer?viewer.getState({viewport:true}):null}}
function restore(v){const byTag=Object.fromEntries(tags.map(t=>[t.tag,t.i])); S.sel=new Set((v.sel||[]).map(x=>byTag[x]).filter(x=>x!=null)); Object.assign(S,{vis:v.vis,colorBy:v.colorBy,time:v.time,ghost:v.ghost,clip:v.clip,zone:v.zone,g1:v.g1,g2:v.g2,q:v.q||''}); S.disc=new Set(v.disc||[]); S.open=new Set(v.open||[]);
  applied={}; refresh(); setT(Math.max(t0,Math.min(v.T||t0,t1))); applyZone(); if(viewer&&v.cam)viewer.restoreState(v.cam,{viewport:true},true)}
function loadViews(){const vs=store.get('views')||{}; $('views').innerHTML='<option value="">—</option>'+Object.keys(vs).map(k=>'<option>'+esc(k)+'</option>').join('')}

/* ---------- planner Excel in, Excel out ---------- */
function applyDates(map){let n=0; tags.forEach(t=>{const d=map[t.tag]; if(!d)return; if(d[2]!=null)t.built=d[2]; if(d[0]&&d[1]){t.s=d[0];t.f=Math.max(d[0],d[1])} if(d[2]||(d[0]&&d[1]))n++}); return n}
function xl(v){if(v==null||v==='')return null; if(v instanceof Date)return Math.round((Date.UTC(v.getFullYear(),v.getMonth(),v.getDate()))/DAY); if(typeof v==='number')return Math.round(v-25569); const m=String(v).match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/); if(m)return Math.round(Date.UTC(+m[3],+m[2]-1,+m[1])/DAY); const p=Date.parse(v); return isNaN(p)?null:Math.round(p/DAY)}
function readBook(buf,fname){try{const wb=XLSX.read(buf,{type:'array',cellDates:true}); const map={}; let seen=0;
    wb.SheetNames.forEach(sn=>{const rs=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true}); const hi=rs.findIndex(x=>x&&x.some(c=>String(c).trim().toUpperCase()==='TAG')); if(hi<0)return; const H=rs[hi].map(c=>String(c||'').trim().toUpperCase()),ct=H.indexOf('TAG'),cs=H.indexOf('START'),cf=H.indexOf('FINISH'),cb=H.findIndex(c=>c.startsWith('BUILT')); if(cs<0||cf<0)return;
      rs.slice(hi+1).forEach(x=>{if(!x||!x[ct])return; seen++; const s=xl(x[cs]),e=xl(x[cf]),bv=cb<0?'':String(x[cb]==null?'':x[cb]).trim().toUpperCase(),b=/^(Y|YES|TRUE|X|1)$/.test(bv)?true:/^(N|NO|FALSE|0)$/.test(bv)?false:null; if((s&&e)||b!=null)map[String(x[ct]).trim()]=[s,e,b]})});
    const n=applyDates(map); if(n){$('dnote').textContent='Planner file '+fname+': '+n+' of '+tags.length+' tags set ('+tags.filter(t=>t.built).length+' on site).'+(n<tags.length?' The others keep example dates.':'')}
    else $('dnote').textContent='Example dates. '+(seen?'No Start and Finish dates found in '+fname+'.':'No sheet with TAG, Start and Finish columns in '+fname+'.');
    if(n&&t0!=null){range(); applied={}; refresh(); setT(Math.max(t0,Math.min(T,t1)))}

  const ws=XLSX.utils.aoa_to_sheet(rowsX,{cellDates:true,dateNF:'dd-mm-yyyy'}); ws['!cols']=[22,22,10,30,20,22,10,10,6,7,12,12,16,9].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Tag list'); XLSX.writeFile(wb,'66A-MPB_sequence_'+n2s(Math.floor(T))+'.xlsx');
}
