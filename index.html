<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westzaan Cx Viewer</title>
<link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css">
<style>
  :root { --bg:#14181d; --panel:#1c2229; --line:#2b333d; --fg:#e6e9ee; --muted:#8a94a3; --accent:#4cc3ff; --ok:#4db85a; }
  * { box-sizing:border-box } html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 "Segoe UI",system-ui,sans-serif; }
  button, select, input { font:inherit; color:var(--fg) }
  #app { display:grid; grid-template-columns:390px 1fr; height:100%; }
  #app.collapsed { grid-template-columns:0 1fr } #app.collapsed #side { overflow:hidden; border:0; min-width:0 }
  #side { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; min-width:0 }
  header { padding:10px 14px 8px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; display:flex; align-items:center; gap:8px }
  header h1 .sp { flex:1 }
  .meta { color:var(--muted); font-size:11px }
  .btn { background:#0f1317; border:1px solid var(--line); border-radius:4px; padding:4px 8px; cursor:pointer; font-size:12px }
  .btn:hover { border-color:var(--accent) } .btn.on { border-color:var(--accent); color:var(--accent) }
  .row { display:flex; gap:6px; padding:6px 14px; flex-wrap:wrap; align-items:center }
  select, input[type=search] { background:#0f1317; border:1px solid var(--line); border-radius:4px; padding:4px 6px; font-size:12px; min-width:0 }
  input[type=search] { flex:1; min-width:120px }
  .facets { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:4px 14px 6px }
  .facets label { display:flex; flex-direction:column; font-size:10px; color:var(--muted); gap:2px } .facets select { width:100% }
  .facets select.set { border-color:var(--accent) }
  .modes { display:flex; flex-wrap:wrap; gap:4px; padding:4px 14px 6px } .modes .btn { flex:1 0 22%; padding:5px 2px }
  table.ct { width:100%; border-collapse:collapse; margin-top:6px; font-size:12px } table.ct td { padding:4px 3px; border-bottom:1px solid #222a33 }
  .tog { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:4px; cursor:pointer }
  #legend { padding:4px 14px 6px; display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11px; color:var(--muted) }
  #legend span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; background:var(--c) }
  #counts { padding:5px 14px; font-size:11px; color:var(--muted); border-top:1px solid var(--line); border-bottom:1px solid var(--line) }
  #pbi { display:none; gap:8px; align-items:center; padding:6px 14px; background:#22313d; font-size:11px }
  #list { flex:1; overflow:auto; min-height:0 }
  .grp { position:sticky; top:0; z-index:1; background:#232a33; padding:6px 14px; cursor:pointer; display:grid; grid-template-columns:14px 1fr auto; gap:6px; align-items:center; border-bottom:1px solid var(--line); font-size:12px }
  .grp.on { background:#1e3a4a } .grp b { font-weight:600 } .grp .n { color:var(--muted); font-size:11px }
  .bar { height:4px; background:#2b333d; border-radius:2px; overflow:hidden; margin-top:3px } .bar i { display:block; height:100%; background:var(--ok) }
  .ss { padding:6px 14px; border-bottom:1px solid #222a33; cursor:pointer; display:grid; grid-template-columns:8px 1fr auto; gap:8px; align-items:center }
  .ss:hover, .ss.sel { background:#232c36 } .ss .dot { width:8px; height:8px; border-radius:50% }
  .ss .t { font-weight:600 } .ss .d { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .ss .v { text-align:right; font-variant-numeric:tabular-nums; font-size:11px; color:var(--muted) } .ss .v b { color:var(--fg); font-size:12px }
  .ss.dim { opacity:.4 }
  #tiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 14px; overflow:auto }
  .tile { background:#0f1317; border:1px solid var(--line); border-radius:6px; padding:8px 10px; cursor:pointer }
  .tile:hover { border-color:var(--accent) } .tile.none { opacity:.45; cursor:default }
  .tile h3 { margin:0; font-size:14px } .tile .k { font-size:11px; color:var(--muted); display:flex; justify-content:space-between }
  .ph4 { display:flex; height:6px; border-radius:3px; overflow:hidden; margin-top:5px; background:#2b333d } .ph4 i { display:block; height:100% }
  #info { border-top:1px solid var(--line); padding:10px 14px; max-height:42%; overflow:auto; font-size:12px; display:none }
  #info h2 { font-size:13px; margin:0 0 6px } #info dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:0 } #info dt { color:var(--muted) } #info dd { margin:0 }
  .ph { display:inline-block; padding:1px 6px; border-radius:3px; font-size:11px; background:#2b333d; margin-right:4px }
  #viewer { position:relative; min-width:0 } #fv { position:absolute; inset:0 }
  #status { position:absolute; left:12px; bottom:12px; background:rgba(20,24,29,.85); padding:6px 10px; border-radius:4px; font-size:11px; color:var(--muted); pointer-events:none; z-index:3 }
  #toggle { position:absolute; left:10px; top:10px; z-index:5 }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:2 }
  #labels div { position:absolute; transform:translate(-50%,-100%); background:rgba(15,19,23,.85); border:1px solid var(--line); border-left:3px solid var(--c); padding:1px 5px; border-radius:3px; font-size:11px; white-space:nowrap }
  #labels div.area { border:1px solid var(--accent); border-left:1px solid var(--accent); font-size:16px; font-weight:700; padding:2px 10px; background:rgba(20,40,55,.85); color:#fff }
  #map { display:none; position:absolute; right:12px; bottom:12px; width:340px; background:rgba(28,34,41,.95); border:1px solid var(--line); border-radius:6px; z-index:4; overflow:hidden }
  #map.big { width:min(72%, 1100px); right:50%; transform:translateX(50%); bottom:auto; top:40px }
  #map.min .mb { display:none } #map .mh { display:flex; gap:8px; align-items:center; padding:5px 8px } #map .mh .meta { flex:1 }
  #map .mb svg { display:block; width:100%; height:auto; background:#fff } #map .ar { cursor:pointer } #map .ar:hover rect { fill-opacity:.45 }
  .pb { display:inline-block; min-width:18px; padding:0 5px; border-radius:3px; font-size:10px; font-weight:700; color:#000; margin-right:4px; text-align:center }
  .pbA { background:#db3832; color:#fff } .pbB { background:#f28c26 } .pbC { background:#edd433 } .pb0 { background:#2b333d; color:var(--muted); font-weight:400 }
  .pr { display:grid; grid-template-columns:auto 1fr; gap:6px; padding:4px 0; border-bottom:1px solid #222a33; font-size:11px } #info h3 { font-size:12px; margin:10px 0 4px }
  #hcard { display:none; position:absolute; z-index:6; width:290px; pointer-events:none; background:rgba(15,19,23,.94); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:12px; box-shadow:0 6px 18px rgba(0,0,0,.4) }
  #hcard .ht { font-weight:700; font-size:13px } #hcard .hrow { display:flex; gap:6px; align-items:center; margin-top:4px } #hcard .hp { font-size:11px; margin-top:3px }
  #labels div.pin { border:0; border-radius:10px; padding:1px 7px; font-weight:700; font-size:11px; color:#fff; background:#db3832; box-shadow:0 0 0 2px rgba(255,255,255,.7) }
  #labels div.pinA { animation:pulse 1.6s infinite } #labels div.pinB { background:#f28c26; color:#000 }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(219,56,50,.8) } 70% { box-shadow:0 0 0 10px rgba(219,56,50,0) } 100% { box-shadow:0 0 0 0 rgba(219,56,50,0) } }
  #gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:10 }
  #gate .box { max-width:440px; padding:28px; background:var(--panel); border:1px solid var(--line); border-radius:8px }
  #gate h2 { margin:0 0 8px } #gate p { color:var(--muted) } #gate .btn { font-size:14px; padding:8px 14px; margin-top:6px }
  a { color:var(--accent) }
  @media (max-width:900px) { #app { grid-template-columns:320px 1fr } }
</style>
</head>
<body>
<div id="gate"><div class="box"><h2>Westzaan Cx Viewer</h2><p id="gatemsg">Checking your session…</p><div id="gatebtn"></div></div></div>
<div id="app">
  <aside id="side">
    <header>
      <h1>Westzaan Cx Viewer <span class="sp"></span>
        <button class="btn" id="home" title="Project overview">Areas</button>
        <button class="btn" id="copy" title="Copy a link to exactly this view">Copy link</button></h1>
      <div class="meta" id="meta">loading…</div>
      <div class="meta" id="who"></div>
    </header>
    <div id="overview" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="row meta">Pick an area to load its models. Numbers come from the data set, no model is loaded yet.</div>
      <div id="tiles"></div>
    </div>
    <div id="work" style="display:none;flex-direction:column;min-height:0;flex:1">
      <div class="row">
        <select id="area" title="Areas loaded in the viewer"></select>
        <input id="q" type="search" placeholder="search tag / subsystem / line">
      </div>
      <div class="facets">
        <label>Priority<select id="f_prio"></select></label>
        <label>Sprint<select id="f_sprint"></select></label>
        <label>Subsystem type<select id="f_typ"></select></label>
        <label>System / fluid code<select id="f_fluid"></select></label>
        <label>Cx phase<select id="f_phase"></select></label>
        <label>Model link<select id="f_link"></select></label>
        <label>Group list by<select id="group">
          <option value="">no grouping</option><option value="fluid">System / fluid code</option><option value="sprint">Sprint</option>
          <option value="prio">Priority</option><option value="phase">Cx phase</option><option value="typ">Subsystem type</option><option value="area">Area</option><option value="link">Model link</option></select></label>
      </div>
      <div class="modes">
        <button class="btn on" data-mode="mc" title="QCR sheets checked → then commissioning phase">MC readiness</button>
        <button class="btn" data-mode="phase">Cx phase</button>
        <button class="btn" data-mode="spool" title="Spool installation % per line">Spools</button>
        <button class="btn" data-mode="sprint">Sprint</button>
        <button class="btn" data-mode="punch" title="Co-Consol punches on the elements they belong to">Punches</button>
        <button class="btn" data-mode="cleared" title="Where punches were cleared recently">Cleared</button>
        <button class="btn" data-mode="qcr" title="QCR sheets checked per line / equipment">QCR</button>
        <button class="btn" data-mode="ready" title="Ready for MC? A-punches, spools and QCR combined">Ready</button>
      </div>
      <div class="facets" id="pfacets" style="display:none"></div>
      <div class="row" style="padding-top:0">
        <label class="tog" title="Card under the mouse in 3D"><input type="checkbox" id="hov"> hover card</label>
        <label class="tog" title="Badges on elements with open A/B punches (Punches mode)"><input type="checkbox" id="pins"> punch pins</label>
        <label class="tog"><input type="checkbox" id="inm"> linked only</label>
        <label class="tog"><input type="checkbox" id="lbl"> tag labels</label>
        <label class="tog"><input type="checkbox" id="ctx"> structure context</label>
        <label class="tog"><input type="checkbox" id="alb"> area labels</label>
        <label class="tog" title="Electrical & instrumentation models of the open areas (panels are not tagged yet, so not coloured)"><input type="checkbox" id="ei"> E&amp;I models</label>
        <select id="views" title="Jump to a saved viewpoint"></select>
        <button class="btn" id="clear" style="margin-left:auto">Clear filters</button>
      </div>
      <div id="legend"></div>
      <div id="pbi"><span></span><button class="btn" style="margin-left:auto">clear</button></div>
      <div id="counts"></div>
      <div id="list"></div>
    </div>
    <div id="info"></div>
  </aside>
  <main id="viewer"><button class="btn" id="toggle" title="Show/hide panel">☰</button><div id="fv"></div><div id="labels"></div><div id="map"></div><div id="status">starting…</div></main>
</div>
<script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="harvest.js"></script>
<script src="app.js"></script>
</body>
</html>
