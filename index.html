<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPB Build Sequence</title>
<link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css">
<style>
/* Design (shared with OneTag): the model is the content; controls sit on quiet dark layers and glass panels.
   Colour carries status only; one accent (blue) marks what is selected or switched on. */
:root{
  --bg:#1c1c1e; --panel:#242426; --panel2:#2c2c2e; --glass:rgba(30,30,32,.82); --line:rgba(255,255,255,.09);
  --ink:#f2f2f7; --mute:#98989f; --accent:#0a84ff; --ok:#30d158; --fill:rgba(118,118,128,.24); --cursor:#ff453a;
  --ghost:#3a3a3c; --built:#8e8e93; --rowalt:#28282a; --selrow:#173a5e; --view:#111; --r:12px;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --f-lab:var(--f-body); --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace; color-scheme:dark;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 6px 0 0;white-space:nowrap}
.lab{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:4px 10px;cursor:pointer;white-space:nowrap;font-size:12.5px;font-weight:500;transition:background .15s}
.seg button:hover{background:rgba(255,255,255,.07)}
.seg button.on{background:#636366;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.btn{border:0;background:var(--fill);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-weight:500;line-height:18px;transition:background .15s}
.btn:hover{background:rgba(118,118,128,.36)} .btn.on{background:var(--accent);color:#fff}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(10,132,255,.45)}
select,input[type=search]{background:var(--fill);border:0;border-radius:8px;padding:6px 10px;min-width:0;outline:none}
select option{background:#2c2c2e}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1 1 300px;min-width:0}
#play{min-width:68px;font-weight:600}
#slider{flex:1 1 120px;min-width:80px;accent-color:var(--accent)}
#date{font-family:var(--f-num);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.note{background:rgba(255,159,10,.13);border-bottom:1px solid var(--line);padding:5px 14px;font-size:12px;color:#ffd8a0}
.note b{color:#ffb340}
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1.25fr) minmax(0,1fr)}
#view{position:relative;background:var(--view);min-height:0;overflow:hidden}
#fv{position:absolute;inset:0}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 30px rgba(0,0,0,.35)}
#load{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:5;padding:12px 18px;max-width:80%;text-align:center}
#signin{position:absolute;left:50%;top:56%;transform:translateX(-50%);z-index:5}
.legend{position:absolute;left:12px;top:12px;z-index:4;display:flex;flex-direction:column;gap:3px;font-size:11.5px;pointer-events:none;max-height:45%;overflow:hidden;padding:8px 12px}
.legend:empty{display:none}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{flex:0 0 10px;width:10px;height:10px;border-radius:3px;display:inline-block}
#active{position:absolute;left:12px;bottom:12px;z-index:4;width:270px;max-width:60%;padding:8px 6px 6px;font-size:12px}
#active:empty{display:none}
#active h4{margin:0 6px 4px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
#active .a{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;cursor:pointer}
#active .a:hover{background:rgba(255,255,255,.06)}
#active .a i{width:10px;height:10px;border-radius:50%}
#active .a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #active .a em{font-style:normal;color:var(--mute)}
#active .a b{font-family:var(--f-num);font-weight:500;font-size:11px;color:var(--mute)}
#side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:var(--panel2);border-radius:10px;padding:7px 9px}
.kpi b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
h2{font-size:14px;font-weight:700;margin:0 0 6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{padding:4px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);font-size:11px}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ghost)}
.st.s1{background:#ff9f0a} .st.s2{background:var(--ok)}
.pbar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;min-width:50px;margin-top:6px}.pbar i{display:block;height:100%}
#grid{grid-column:1 / -1;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#gbar{border-bottom:1px solid var(--line)}
#gantt{flex:1 1 auto;overflow:auto;position:relative;min-height:0}
.g{position:relative;min-width:max-content}
.ghead{position:sticky;top:0;z-index:3;display:flex;background:var(--panel2);border-bottom:1px solid var(--line);height:26px}
.gl{position:sticky;left:0;z-index:2;flex:0 0 var(--lw);width:var(--lw);background:inherit;border-right:1px solid var(--line);display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.gl .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.gl .c{flex:0 0 62px;text-align:right;padding-right:8px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--mute)}
.gl .c.q{flex-basis:92px}
.gt{position:relative;flex:0 0 auto}
.mon{position:absolute;top:0;height:26px;border-left:1px solid var(--line);padding:6px 6px 0;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.row{display:flex;height:24px;background:var(--panel);cursor:pointer;font-size:12.5px}
.row:nth-child(even){background:var(--rowalt)}
.row.gp{font-weight:600}
.row.sel,.row.sel:nth-child(even){background:var(--selrow)}
.row.sel .gl{box-shadow:inset 3px 0 0 var(--accent)}
.row.hid .nm,.row.hid .c{opacity:.38}
.row em{font-style:normal;color:var(--mute);font-size:11.5px;font-weight:400}
.tw{flex:0 0 18px;text-align:center;font-size:10px;color:var(--mute);height:24px;line-height:24px}
.eye{flex:0 0 22px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.eye::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px rgba(10,132,255,.25)}
.row.hid .eye::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mute)}
.b{position:absolute;top:6px;height:12px;border-radius:4px;min-width:3px}
.row.gp .b{top:8px;height:8px;background:rgba(255,255,255,.14)}.row.gp .b i{display:block;height:100%;background:var(--ok);border-radius:4px}
.b.s0{opacity:.4}.b.s2{filter:saturate(.5) brightness(.8)}.b.s1{box-shadow:0 0 0 1.5px #fff}
.site{position:sticky;left:calc(var(--lw) + 8px);display:inline-block;margin-top:4px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ok);background:rgba(48,209,88,.14);border-radius:6px;padding:0 7px;line-height:16px}
#cur{position:absolute;top:0;bottom:0;width:13px;margin-left:-6px;z-index:4;cursor:ew-resize;touch-action:none}
#cur::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:3px;background:var(--cursor);border-radius:2px}
#cur b{position:sticky;top:4px;display:block;width:max-content;transform:translateX(-50%);margin-left:6px;background:var(--cursor);color:#fff;font-family:var(--f-num);font-size:11px;font-weight:500;padding:1px 7px;border-radius:6px;white-space:nowrap}
#today{position:absolute;top:26px;bottom:0;width:0;border-left:1px dashed var(--mute);z-index:1;pointer-events:none}
.ghead .gt{cursor:ew-resize;touch-action:none}
body.scrub{user-select:none;cursor:ew-resize}
#msg{color:var(--mute)}
#rpanel{position:absolute;right:12px;top:12px;bottom:12px;width:300px;max-width:92%;z-index:6;overflow:auto;padding:12px 14px;font-size:12.5px}
#rpanel h3{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:14px 0 4px}
#rpanel .r{display:grid;grid-template-columns:112px minmax(0,1fr) 40px;align-items:center;gap:6px;min-height:30px}
#rpanel .r output{font-family:var(--f-num);font-size:11px;text-align:right;color:var(--mute)}
#rpanel input[type=range]{width:100%;accent-color:var(--accent)} #rpanel input[type=color]{width:44px;height:24px;padding:0;border:0;border-radius:6px;background:none}
#rpanel input[type=checkbox]{appearance:none;-webkit-appearance:none;width:36px;height:22px;border-radius:11px;background:rgba(120,120,128,.4);position:relative;cursor:pointer;margin:0;transition:background .2s}
#rpanel input[type=checkbox]::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s}
#rpanel input[type=checkbox]:checked{background:var(--ok)} #rpanel input[type=checkbox]:checked::after{transform:translateX(14px)}
#rpanel select{width:100%} #rpanel textarea{width:100%;height:110px;font-family:var(--f-num);font-size:10.5px;border:0;border-radius:8px;background:var(--fill);color:var(--ink);margin-top:6px;padding:6px}
#rpanel .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (max-width:820px){
  html,body{height:auto} body{display:block} .main{display:block}
  #view{height:52vh;min-height:300px} #side{border-left:0;border-top:1px solid var(--line)} #grid{height:70vh}
  .gl .c{display:none} #active{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="bar">
  <h1>MPB Build Sequence</h1>
  <div class="ctl">
    <button class="btn" id="play" type="button">Play</button>
    <select id="speed" aria-label="Animation speed"><option value="7">1 week / s</option><option value="14" selected>2 weeks / s</option><option value="30">1 month / s</option></select>
    <input id="slider" type="range" min="0" max="100" value="0" aria-label="Programme date">
    <span id="date"></span>
  </div>
  <button class="btn on" id="t4d" type="button" title="Off: show the whole model regardless of dates">4D time: on</button>
  <label class="btn" for="file">Load planner Excel<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></label>
  <button class="btn" id="export" type="button">Export Excel</button>
</div>
<div class="bar" id="zbar"><span class="lab">Zone views</span></div>
<div class="bar" id="vbar">
  <div class="grp"><span class="lab">Colour by</span><select id="colorBy"><option value="real">Build status</option><option value="status">Status by discipline</option><option value="disc">Discipline</option><option value="pkg">Package</option><option value="zone">Zone</option><option value="floor">Floor</option><option value="group">Model item group</option></select></div>
  <div class="grp"><span class="lab">Selection</span><span class="seg" id="vis"><button type="button" data-v="normal" class="on">Highlight</button><button type="button" data-v="isolate">Isolate</button><button type="button" data-v="ghost">Ghost others</button><button type="button" data-v="hide">Hide</button></span><button class="btn" id="clear" type="button">Clear</button></div>
  <div class="grp"><span class="lab">Click selects</span><span class="seg" id="pick"><button type="button" data-v="tag" class="on">Group</button><button type="button" data-v="el">Element</button></span></div>
  <div class="grp"><button class="btn on" id="clip" type="button" title="Cut the model to the chosen zone">Section box: on</button><button class="btn" id="fit" type="button">Fit</button></div>
  <div class="grp"><span class="lab">Not started</span><span class="seg" id="ns"><button type="button" data-v="off">Hidden</button><button type="button" data-v="ghost">Faint</button></span></div>
  <div class="grp"><span class="lab">Built</span><span class="seg" id="bu"><button type="button" data-v="solid">Solid</button><button type="button" data-v="ghost">X-ray</button><button type="button" data-v="off">Hidden</button></span><select id="recent" aria-label="Keep recently finished work solid" title="Work finished within this time stays solid, so you can follow the sequence"><option value="0">no recent</option><option value="14">recent 2 weeks solid</option><option value="28">recent 4 weeks solid</option><option value="56">recent 8 weeks solid</option></select></div>
  <div class="grp"><button class="btn" id="grow" type="button" title="Elements of a running activity appear step by step, from the bottom up">Grow: on</button></div>
  <div class="grp"><button class="btn" id="rbtn" type="button">Render settings</button><button class="btn" id="orbit" type="button" title="Slowly turn the camera around the building while playing">Orbit: off</button></div>
  <div class="grp"><span class="lab">Saved views</span><select id="views"><option value="">—</option></select><button class="btn" id="vsave" type="button">Save</button><button class="btn" id="vdel" type="button">Delete</button></div>
</div>
<div class="note" id="note"><b id="dnote">Example dates.</b> <span id="msg"></span></div>
<div class="main">
  <div id="view"><div id="fv"></div><div id="load" class="glass">Starting…</div><button class="btn on" id="signin" type="button" hidden>Sign in with Autodesk</button><div class="legend glass" id="legend"></div><div class="glass" id="active"></div><div class="glass" id="rpanel" hidden></div></div>
  <div id="side">
    <div class="kpis">
      <div class="kpi"><b id="k2">0</b><span class="lab">Built</span></div>
      <div class="kpi"><b id="k1">0</b><span class="lab">In progress</span></div>
      <div class="kpi"><b id="k0">0</b><span class="lab">To start</span></div>
    </div>
    <div id="selbox"></div>
  </div>
  <div id="grid">
    <div class="bar" id="gbar">
      <div class="grp"><span class="lab">Group by</span><select id="g1"></select><span class="lab">then</span><select id="g2"></select></div>
      <div class="grp"><span class="lab">Discipline</span><span class="seg" id="fdisc"></span></div>
      <input type="search" id="q" placeholder="Search tag, group, package" aria-label="Search">
      <button class="btn" id="expand" type="button">Expand all</button>
      <span class="lab" id="count"></span>
    </div>
    <div id="gantt"><div class="g" id="g"></div></div>
  </div>
</div>
<script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js?v=2026-10-06b"></script>
<script src="auth.js?v=2026-10-06b"></script>
<script>
(function(){
const DC={CI:'#8c8478',ST:'#5b6c8f',FA:'#2e86ab',AR:'#d9a021',HV:'#3aa17e',FF:'#d1495b',PH:'#7b5ea7',PI:'#e07a3f',EL:'#b0408f',FU:'#946b4a'};
const DN={CI:'Civil',ST:'Structure',FA:'Facade and roof',AR:'Interior',HV:'HVAC',FF:'Sprinkler',PH:'Plumbing',PI:'Lab gas',EL:'Electrical',FU:'Furniture and equipment'};
const PAL=['#2e86ab','#d9a021','#d1495b','#3aa17e','#7b5ea7','#e07a3f','#5b6c8f','#b0408f','#946b4a','#6aa84f','#c2185b','#00838f','#8d6e63','#5c6bc0','#f4b400','#455a64'];
const SN=['Not started','In progress','Built'];
const span=ts=>{const a=ts.filter(t=>!t.built); return a.length?[Math.min(...a.map(t=>t.s)),Math.max(...a.map(t=>t.f))]:null};
const DAY=864e5, $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const d2n=s=>Math.round(Date.parse(s+'T00:00:00Z')/DAY), n2s=n=>{const d=new Date(n*DAY);return String(d.getUTCDate()).padStart(2,'0')+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+d.getUTCFullYear()};
const num=v=>v.toLocaleString('en-GB'), fmt=(v,u)=>num(u==='no.'?Math.round(v):v>=100?Math.round(v):Math.round(v*10)/10)+' '+u;
const CFG=window.CX_CONFIG,A=window.CX_AUTH;
const store={get(k){try{return JSON.parse(localStorage.getItem('mpb4d.'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('mpb4d.'+k,JSON.stringify(v))}catch(e){}}};

let D,tags=null,T=0,t0=null,t1,playing=false,PX=3,LW=430;
// view state
const S={sel:new Set(),off:new Set(),ns:'off',bu:'ghost',recent:28,grow:true,vis:'normal',colorBy:'real',pick:'tag',time:true,clip:true,zone:null,g1:'zone',g2:'',disc:new Set(),q:'',open:new Set()};
let viewer=null,models={},tagIds={},id2tag={},applied={},muting=false,boundsCache={};
const say=t=>{$('load').hidden=!t;$('load').textContent=t};

const floorOf=z=>{const m=/^(?:STR-)?(GF|1F|2F|3F)/.exec(z);return m?m[1]:(z==='ROOF'?'Roof':z==='SUB'?'Substructure':'Building')};
const KEY={zone:t=>t.zoneName,floor:t=>t.floor,block:t=>t.block,disc:t=>DN[t.disc],pkg:t=>t.pkg,group:t=>t.name,status:t=>SN[st(t)]};
const KN={zone:'Zone',floor:'Floor',block:'Shell / fit-out',disc:'Discipline',pkg:'Package',group:'Model item group',status:'Status'};

start().catch(e=>{say('Error: '+e.message);console.error(e)});

async function start(){
  const tok=await A.init();
  if(!tok){$('signin').hidden=false;$('signin').onclick=()=>A.login();say('Sign in with your Autodesk account to load the models.');return}
  say('Reading data from ACC…');
  const alt=n=>n.replace(/_/g,' '); const d=await A.readDataFile(CFG.dataFile)||await A.readDataFile(alt(CFG.dataFile));
  if(!d){say('The file '+CFG.dataFile+' was not found in the ACC data folder, or you have no access to that folder.');return}
  D=d; const zn=Object.fromEntries(D.zones.map(z=>[z[0],z]));
  tags=D.tags.map((t,i)=>({i,tag:t[0],zone:t[1],group:t[2],n:t[3],qty:t[4],unit:t[5],s:d2n(t[6]),f:d2n(t[7]),built:!!t[8],name:D.groups[t[2]][0],pkg:D.groups[t[2]][1],disc:D.groups[t[2]][2],
    zoneName:zn[t[1]][1],block:zn[t[1]][2]==='A'?'Shell':'Fit-out',floor:floorOf(t[1]),zo:D.zones.indexOf(zn[t[1]])}));
  try{const b=await A.readDataBlob(CFG.scheduleFile)||await A.readDataBlob(alt(CFG.scheduleFile)); if(b)readBook(await b.arrayBuffer(),CFG.scheduleFile+' in ACC')}catch(e){console.warn('no schedule file',e)}
  buildBars(); range(); bind(); setT(t0); refresh();
  await initViewer();
}
function range(){const ts=tags.filter(t=>!t.built); if(!ts.length)ts.push(...tags); t0=Math.min(...ts.map(t=>t.s))-7;t1=Math.max(...ts.map(t=>t.f))+14;$('slider').min=t0;$('slider').max=t1}
function st(t){return !S.time||t.built?2:T<t.s?0:T<=t.f?1:2}
function real(t){return t.built?2:T<t.s?0:T<=t.f?1:2}
function inZone(t){const z=S.zone; return !z||(z.length===2||z==='Roof'?t.floor===z:t.zone===z)}
function pass(t){if(!inZone(t))return false; if(S.disc.size&&!S.disc.has(t.disc))return false; if(S.q){const q=S.q.toLowerCase(); if(!(t.tag+' '+t.name+' '+t.pkg+' '+t.zoneName).toLowerCase().includes(q))return false} return true}

/* ---------- toolbars ---------- */
function buildBars(){
  // zone buttons from the zone list: All | per floor: floor button + its zones | shell zones
  const zb=$('zbar'); let h='<span class="lab">Zone views</span><span class="seg"><button type="button" data-z="">All</button></span>';

// link the IFC GlobalIds in the data file to this model's element ids (external id = GlobalId, children carry a /n suffix)
async function mapModel(code,m){

  let e2id=await new Promise(r=>m.getExternalIdMapping(r,()=>r({})));
  let h=0; for(const a of all)for(const g of a)if(e2id[g]!=null)h++;
  if(h<tot*0.2){ // this translation keeps the IFC GlobalId as the property Element > IfcGUID: read it from the property database
    try{const alt=await m.getPropertyDb().executeUserFunction(function(pdb){var ai={},any={};pdb.enumAttributes(function(i,d){if(d.displayName==='IfcGUID'||/^(globalid|ifcguid)$/i.test(d.name)){any[i]=1;if(d.category==='Element')ai[i]=1}});
        if(!Object.keys(ai).length)ai=any; var out={};pdb.enumObjects(function(dbId){pdb.enumObjectProperties(dbId,function(a,v){if(ai[a]){var g=pdb.getAttrValue(a,v);if(g&&out[g]==null)out[g]=dbId}})});return out});
      if(alt&&Object.keys(alt).length)e2id=alt}catch(e){console.warn('IfcGUID property scan failed',code,e)}
  }
  let hit=0; tagIds[code]={}; id2tag[code]={};
  D.map[code].forEach((g,k)=>{const ids=[]; for(const guid of all[k]){const id=e2id[guid]; if(id!=null){ids.push(id);id2tag[code][id]=g[0];hit++}} tagIds[code][g[0]]=ids});
  await new Promise(r=>m.getObjectTree(()=>r(),()=>r()));
  viewer.hide(m.getRootId(),m); setOff([m.getRootId()],m,true);   // everything starts switched off; tags switch elements on
  return [code,tot,hit];
}

  $('orbit').onclick=()=>{S.orbit=!S.orbit; $('orbit').classList.toggle('on',S.orbit); $('orbit').textContent='Orbit: '+(S.orbit?'on':'off')};
  $('g').addEventListener('click',rowClick); $('g').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();rowClick(e)}});
  // the date can be dragged in the Gantt: on the month strip or on the red line
  let scrub=false; const toT=e=>{const r=$('g').getBoundingClientRect(); return Math.max(t0,Math.min(t1,t0+(e.clientX-r.left-LW)/PX))};
  $('gantt').addEventListener('pointerdown',e=>{if(!(e.target.closest('#cur')||e.target.closest('.ghead .gt')))return; scrub=true; document.body.classList.add('scrub'); toggle(false); setT(toT(e)); e.preventDefault()});
  addEventListener('pointermove',e=>{if(scrub)setT(toT(e))}); addEventListener('pointerup',()=>{if(scrub){scrub=false;document.body.classList.remove('scrub')}});
  $('gantt').addEventListener('dblclick',e=>{const gt=e.target.closest('.gt'); if(!gt)return; toggle(false); setT(toT(e))});
  $('vsave').onclick=()=>{const cur=$('views').value, name=(cur||('View '+n2s(Math.floor(T))+' '+(S.zone||'all')+' '+new Date().toTimeString().slice(0,5))); const vs=store.get('views')||{}; vs[name]=snap(); store.set('views',vs); loadViews(); $('views').value=name};
  $('vdel').onclick=()=>{const vs=store.get('views')||{}; delete vs[$('views').value]; store.set('views',vs); loadViews()};
  $('views').onchange=e=>{const v=(store.get('views')||{})[e.target.value]; if(v)restore(v)};
  addEventListener('resize',()=>{buildGrid(); if(viewer)viewer.resize()});
}
})();
</script></body></html>
